name: Update FC Online Data

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-fc-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update FC Online data
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          API_KEY = os.environ["NEXON_API_KEY"]

          FILE = "data/streamers.json"

          with open(FILE, "r", encoding="utf-8") as f:
              streamers = json.load(f)

          changed = False


          def nexon_get(path):
              url = "https://open.api.nexon.com" + path

              req = urllib.request.Request(
                  url,
                  headers={
                      "x-nxopen-api-key": API_KEY,
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )


          for streamer in streamers:

              nickname = (
                  streamer.get("fcNickname") or ""
              ).strip()

              if not nickname:
                  print(
                      f"[SKIP] {streamer.get('id')} - FC 닉네임 없음"
                  )
                  continue


              try:

                  fc_ouid = (
                      streamer.get("fcOuid") or ""
                  ).strip()


                  # =================================================
                  # 1. fcOuid가 없는 경우
                  #    FC 닉네임 → OUID
                  # =================================================

                  if not fc_ouid:

                      print(
                          f"[LOOKUP] {streamer.get('name')} / {nickname}"
                      )

                      encoded_nickname = urllib.parse.quote(
                          nickname,
                          safe=""
                      )

                      data = nexon_get(
                          f"/fconline/v1/id?nickname={encoded_nickname}"
                      )

                      new_ouid = data.get("ouid")

                      if not new_ouid:
                          print(
                              f"[FAIL] OUID 없음: {nickname}"
                          )
                          continue

                      streamer["fcOuid"] = new_ouid

                      fc_ouid = new_ouid

                      changed = True

                      print(
                          f"[OUID] {nickname} → {new_ouid}"
                      )


                  # =================================================
                  # 2. OUID → 현재 닉네임
                  # =================================================

                  basic = nexon_get(
                      "/fconline/v1/user/basic?ouid="
                      + urllib.parse.quote(
                          fc_ouid,
                          safe=""
                      )
                  )

                  current_nickname = (
                      basic.get("nickname") or ""
                  ).strip()


                  if (
                      current_nickname
                      and current_nickname != nickname
                  ):

                      print(
                          "[NICKNAME CHANGE] "
                          f"{nickname} → {current_nickname}"
                      )

                      streamer["fcNickname"] = (
                          current_nickname
                      )

                      changed = True

                  else:

                      print(
                          f"[OK] {streamer.get('name')} / "
                          f"{current_nickname}"
                      )


                  # =================================================
                  # 3. 공식경기 1on1 티어 조회
                  # =================================================

                  division_data = nexon_get(
                      "/fconline/v1/user/maxdivision"
                      "?ouid="
                      + urllib.parse.quote(
                          fc_ouid,
                          safe=""
                      )
                      + "&matchtype=50"
                  )

                  if isinstance(division_data, list):
                      entry = (
                          division_data[0]
                          if division_data
                          else {}
                      )
                  else:
                      entry = division_data or {}


                  division_id = entry.get("division")

                  if division_id is not None:

                      if (
                          streamer.get("divisionId")
                          != division_id
                      ):
                          streamer["divisionId"] = (
                              division_id
                          )

                          changed = True

                      print(
                          f"[TIER] "
                          f"{streamer.get('name')} → "
                          f"{division_id}"
                      )

                  else:

                      print(
                          f"[TIER FAIL] "
                          f"{streamer.get('name')}"
                      )


              except Exception as e:

                  print(
                      f"[ERROR] "
                      f"{streamer.get('name')} / "
                      f"{nickname} / "
                      f"{e}"
                  )


          # =========================================================
          # 변경사항 저장
          # =========================================================

          if changed:

              with open(
                  FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      streamers,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

                  f.write("\n")


              print(
                  "FC 데이터가 변경되었습니다."
              )

          else:

              print(
                  "변경사항이 없습니다."
              )


          # =========================================================
          # TEST: 호날두 최근 공식경기 1대1 매치 확인
          # =========================================================

          TEST_OUID = "9fa3cdef6848f132aa27a3c0a55aea6e"

          try:

              print("")
              print("==========================================")
              print("[TEST] 호날두 최근 공식경기 1대1 매치")
              print("==========================================")


              match_data = nexon_get(
                  "/fconline/v1/user/match"
                  "?ouid="
                  + urllib.parse.quote(
                      TEST_OUID,
                      safe=""
                  )
                  + "&matchtype=50"
                  + "&offset=0"
                  + "&limit=5"
              )


              print(
                  "[TEST] 최근 매치 ID:"
              )


              if isinstance(match_data, list):

                  for index, match_id in enumerate(
                      match_data,
                      start=1
                  ):

                      print(
                          f"[TEST] {index}. {match_id}"
                      )

              else:

                  print(
                      "[TEST] 예상하지 못한 응답:"
                  )

                  print(match_data)


          except Exception as e:

              print(
                  "[TEST ERROR]",
                  e
              )


          print("==========================================")
          print("")

          # =========================================================
          # TEST 2: 호날두 최근 경기 상세정보의 division 확인
          # =========================================================

          TEST_MATCH_ID = "6a83eddbbbf5491b9a5c3e7b"

          try:

              print("")
              print("==========================================")
              print("[TEST 2] 호날두 최근 경기 상세정보")
              print("==========================================")


              detail_data = nexon_get(
                  "/fconline/v1/match-detail"
                  "?matchid="
                  + urllib.parse.quote(
                      TEST_MATCH_ID,
                      safe=""
                  )
              )


              print("[TEST 2] 매치 상세정보:")

              print(
                  json.dumps(
                      detail_data,
                      ensure_ascii=False,
                      indent=2
                  )
              )


          except Exception as e:

              print(
                  "[TEST 2 ERROR]",
                  e
              )


          print("==========================================")
          print("")


          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/streamers.json

          if git diff --cached --quiet; then
            echo "변경사항 없음"
            exit 0
          fi

          git commit -m "Auto update FC Online data"
          git push

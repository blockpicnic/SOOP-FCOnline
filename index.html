<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC온라인 스트리머 티어보드</title>

<!-- ============================================================
     GOOGLE FONT
============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap"
  rel="stylesheet"
>

<style>

/* ============================================================
   ROOT
============================================================ */

:root{
  --bg:#0c1210;
  --bg-elev:#121a17;
  --bg-elev-2:#17211d;

  --pitch-line:#22332c;

  --turf:#9bff5c;
  --turf-dim:#6fbf3f;

  --text:#eef5ee;
  --text-dim:#93a89c;

  --unranked:#5c6b64;

  --card-radius:14px;

  --font-display:
    'Noto Sans KR',
    sans-serif;

  --font-body:
    'Noto Sans KR',
    sans-serif;

  --font-mono:
    'Noto Sans KR',
    sans-serif;
}


/* ============================================================
   RESET
============================================================ */

*{
  box-sizing:border-box;
}

html{
  font-family:var(--font-body);
}

body{
  margin:0;

  background:
    radial-gradient(
      circle at 15% -10%,
      rgba(155,255,92,.10),
      transparent 45%
    ),
    var(--bg);

  color:var(--text);

  font-family:var(--font-body);

  padding-bottom:60px;
}


/* ============================================================
   HEADER
============================================================ */

header{
  padding:28px 20px 20px;

  border-bottom:1px solid var(--pitch-line);

  position:sticky;
  top:0;
  z-index:20;

  background:rgba(12,18,16,.95);

  backdrop-filter:blur(10px);
}


/* ============================================================
   HERO
============================================================ */

.hero{
  position:relative;

  max-width:1000px;

  margin:0 auto;

  padding:28px 24px 24px;

  overflow:hidden;

  border-radius:16px;

  background:
    linear-gradient(
      90deg,
      rgba(12,18,16,.97),
      rgba(12,18,16,.82),
      rgba(12,18,16,.94)
    ),
    url('/assets/fconline-bg.jpg')
    center/cover no-repeat;

  border:1px solid rgba(155,255,92,.12);
}

.hero::after{
  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      135deg,
      rgba(155,255,92,.08),
      transparent 45%
    );
}

.hero-content{
  position:relative;
  z-index:1;
}

.eyebrow{
  font-family:var(--font-body);

  font-size:12px;

  letter-spacing:.12em;

  color:var(--turf);

  text-transform:uppercase;

  margin:0 0 6px;

  font-weight:700;
}

h1{
  font-family:var(--font-display);

  font-size:clamp(24px,6vw,36px);

  letter-spacing:-.03em;

  margin:0 0 5px;

  line-height:1.1;

  font-weight:900;
}

.sub{
  color:var(--text-dim);

  font-size:14px;

  margin:0;

  font-weight:500;
}


/* ============================================================
   CONTROLS
============================================================ */

.controls{
  display:flex;

  gap:8px;

  margin:14px auto 0;

  max-width:1000px;

  flex-wrap:wrap;

  justify-content:flex-start;
}

.controls input[type=text]{
  flex:1;

  min-width:180px;

  background:var(--bg-elev);

  border:1px solid var(--pitch-line);

  color:var(--text);

  padding:11px 13px;

  border-radius:10px;

  font-family:var(--font-body);

  font-size:14px;

  outline:none;
}

.controls input[type=text]:focus{
  border-color:rgba(155,255,92,.45);
}

select{
  background:var(--bg-elev);

  border:1px solid var(--pitch-line);

  color:var(--text);

  padding:11px 13px;

  border-radius:10px;

  font-size:13px;

  font-family:var(--font-body);

  outline:none;

  cursor:pointer;
}


/* ============================================================
   FILTER PANEL
============================================================ */

.filter-panel{
  max-width:1000px;

  margin:0 auto;

  padding:14px 20px 0;

  text-align:left;
}

.filter-row{
  display:flex;

  align-items:center;

  justify-content:flex-start;

  gap:7px;

  overflow-x:auto;

  scrollbar-width:none;

  padding-bottom:3px;
}

.filter-row::-webkit-scrollbar{
  display:none;
}

.filter-btn{
  flex-shrink:0;

  border:1px solid var(--pitch-line);

  background:var(--bg-elev);

  color:var(--text-dim);

  border-radius:9px;

  padding:8px 12px;

  font-size:12px;

  font-family:var(--font-body);

  cursor:pointer;

  transition:.15s;

  font-weight:600;
}

.filter-btn:hover{
  border-color:rgba(155,255,92,.35);

  color:var(--text);
}

.filter-btn.active{
  background:rgba(155,255,92,.10);

  border-color:rgba(155,255,92,.45);

  color:var(--turf);

  font-weight:800;
}


/* ============================================================
   ACTIVE FILTER
============================================================ */

.active-filters{
  display:none;

  align-items:center;

  gap:6px;

  flex-wrap:wrap;

  margin-top:10px;
}

.active-filters.has-filter{
  display:flex;
}

.filter-label{
  font-size:11px;

  color:var(--text-dim);

  font-family:var(--font-body);

  font-weight:700;
}

.active-chip{
  display:inline-flex;

  align-items:center;

  gap:5px;

  border-radius:7px;

  padding:5px 8px;

  border:1px solid rgba(155,255,92,.25);

  background:rgba(155,255,92,.07);

  color:var(--turf);

  font-size:11px;

  cursor:pointer;

  font-family:var(--font-body);

  font-weight:600;
}

.clear-filters{
  border:0;

  background:transparent;

  color:var(--text-dim);

  font-size:11px;

  cursor:pointer;

  font-family:var(--font-body);
}


/* ============================================================
   MAIN
============================================================ */

main{
  max-width:1000px;

  margin:0 auto;

  padding:18px 20px 0;
}

.live-strip{
  display:flex;

  align-items:center;

  gap:8px;

  font-family:var(--font-body);

  font-size:12px;

  color:var(--text-dim);

  margin:8px 2px 16px;

  letter-spacing:.01em;

  font-weight:600;
}

.dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:#ff5c5c;

  box-shadow:0 0 8px #ff5c5c;

  animation:pulse 1.6s infinite;
}

@keyframes pulse{
  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.35;
  }
}


/* ============================================================
   STREAMER GRID
   PC = 3명
============================================================ */

.streamer-grid{
  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:14px;
}


/* ============================================================
   CARD
============================================================ */

.card{
  min-width:0;

  background:var(--bg-elev);

  border:1px solid var(--pitch-line);

  border-radius:var(--card-radius);

  padding:13px;

  display:flex;

  flex-wrap:wrap;

  align-items:flex-start;

  gap:11px;

  position:relative;

  overflow:hidden;

  transition:
    border-color .15s,
    transform .15s,
    background .15s;
}

.card:hover{
  border-color:#30463b;

  background:#141e1a;

  transform:translateY(-2px);
}

.card.live{
  border-color:rgba(255,92,92,.5);
}

.card.live::before{
  content:"";

  position:absolute;

  left:0;
  right:0;
  top:0;

  height:3px;

  background:#ff5c5c;
}


/* ============================================================
   SOOP TIER - 우측 상단
============================================================ */

.card-soop-tier{
  position:absolute;

  top:10px;
  right:10px;

  z-index:2;

  border:1px solid rgba(155,255,92,.25);

  background:rgba(155,255,92,.08);

  color:var(--turf);

  border-radius:7px;

  padding:4px 7px;

  font-family:var(--font-body);

  font-size:10px;

  font-weight:800;

  white-space:nowrap;

  cursor:pointer;
}


/* ============================================================
   AVATAR
============================================================ */

.streamer-link{
  display:block;

  color:inherit;

  text-decoration:none;

  border-radius:12px;

  outline:none;

  flex-shrink:0;
}

.avatar{
  width:68px;

  height:68px;

  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      var(--pitch-line),
      #1c2822
    );

  display:flex;

  align-items:center;

  justify-content:center;

  font-family:var(--font-display);

  font-size:21px;

  color:var(--turf-dim);

  overflow:hidden;

  border:1px solid transparent;

  transition:.15s;

  font-weight:900;
}

.avatar img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.streamer-link:hover .avatar{
  border-color:rgba(155,255,92,.45);

  transform:translateY(-1px);
}


/* ============================================================
   META
============================================================ */

.meta{
  min-width:0;

  flex:1;

  padding-right:45px;

  text-align:left;
}

.name-row{
  display:flex;

  align-items:center;

  justify-content:flex-start;

  gap:7px;

  flex-wrap:nowrap;

  min-width:0;
}

.name{
  font-weight:900;

  font-size:17px;

  transition:color .15s;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.streamer-link:hover .name{
  color:var(--turf);
}

.live-badge{
  font-family:var(--font-body);

  font-size:10px;

  background:#ff5c5c;

  color:#1a0a0a;

  padding:3px 7px;

  border-radius:5px;

  font-weight:900;

  flex-shrink:0;
}


/* ============================================================
   FC NICKNAME
============================================================ */

.fc-nickname{
  margin-top:6px;

  display:flex;

  align-items:center;

  justify-content:flex-start;

  gap:5px;

  color:var(--text);

  font-size:14px;

  line-height:1.25;

  font-weight:800;

  letter-spacing:-.015em;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.fc-ball{
  font-size:13px;

  line-height:1;

  flex-shrink:0;
}


/* ============================================================
   SOOP ID
============================================================ */

.id-line{
  font-family:var(--font-body);

  font-size:11px;

  color:var(--text-dim);

  margin-top:4px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  font-weight:600;
}


/* ============================================================
   TIER
============================================================ */

.tier-wrap{
  margin-top:7px;
}

.badge-row{
  display:flex;

  align-items:center;

  justify-content:flex-start;

  gap:6px;

  flex-wrap:wrap;
}


/* ============================================================
   BADGES
============================================================ */

.filter-badge{
  border:1px solid rgba(155,255,92,.25);

  background:rgba(155,255,92,.08);

  color:var(--turf);

  cursor:pointer;

  font-family:var(--font-body);

  font-size:10px;

  font-weight:800;

  letter-spacing:.01em;

  padding:5px 8px;

  border-radius:7px;

  white-space:nowrap;

  transition:.12s;
}

.filter-badge:hover{
  filter:brightness(1.15);

  border-color:rgba(155,255,92,.45);

  transform:translateY(-1px);
}

.filter-badge:active{
  transform:scale(.97);
}


/* ============================================================
   FC / SOOP / CREW 색상 통일
============================================================ */

.tier-top,
.tier-high,
.tier-mid,
.tier-low,
.tier-basic,
.tier-unranked,
.soop-badge,
.soop-2,
.soop-6,
.soop-100,
.soop-other,
.crew-badge,
.crew-0,
.crew-1,
.crew-2,
.crew-3,
.crew-4{
  background:rgba(155,255,92,.08);

  color:var(--turf);

  border-color:rgba(155,255,92,.25);
}


/* ============================================================
   CARD BOTTOM INFO
   크루명 → Division → Note
   카드 전체 폭 사용
============================================================ */

.card-info-row{
  width:100%;

  min-width:0;

  display:flex;

  align-items:center;

  justify-content:flex-start;

  gap:7px;

  padding-top:1px;

  border-top:1px solid rgba(34,51,44,.7);

  overflow:hidden;
}

.card-info-item{
  min-width:0;

  flex:0 1 auto;

  display:block;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:clip;

  font-size:11px;

  line-height:1.4;

  font-weight:600;

  color:var(--text-dim);
}

.card-info-item.crew-info{
  color:var(--turf);

  font-weight:800;
}

.card-info-item.division-info{
  color:var(--text);
}

.card-info-item.note-info{
  color:var(--text-dim);

  flex:1 1 auto;

  overflow:hidden;

  text-overflow:ellipsis;
}

.card-info-separator{
  flex-shrink:0;

  color:#4b5d54;

  font-size:10px;
}


/* ============================================================
   EMPTY
============================================================ */

.empty{
  grid-column:1/-1;

  text-align:center;

  padding:50px 20px;

  color:var(--text-dim);

  font-size:14px;
}

.empty strong{
  display:block;

  color:var(--text);

  margin-bottom:5px;
}

.empty small{
  font-size:12px;
}


/* ============================================================
   FOOTER
============================================================ */

footer{
  max-width:1000px;

  margin:28px auto 0;

  padding:0 20px;

  font-family:var(--font-body);

  font-size:11px;

  color:var(--text-dim);

  line-height:1.6;
}

footer code{
  background:var(--bg-elev);

  padding:1px 5px;

  border-radius:4px;
}


/* ============================================================
   TABLET
============================================================ */

@media(max-width:850px){

  .streamer-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}


/* ============================================================
   MOBILE
============================================================ */

@media(max-width:620px){

  header{
    padding:18px 12px 14px;
  }

  .hero{
    padding:22px 16px;
  }

  .filter-panel{
    padding-left:12px;
    padding-right:12px;
  }

  main{
    padding-left:12px;
    padding-right:12px;
  }

  .streamer-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:9px;
  }

  .card{
    padding:11px 9px 11px;

    gap:8px;
  }

  .avatar{
    width:56px;
    height:56px;

    border-radius:10px;
  }

  .meta{
    padding-right:36px;
  }

  .name{
    font-size:14px;
  }

  .fc-nickname{
    font-size:13px;
  }

  .id-line{
    font-size:10px;
  }

  .card-soop-tier{
    top:8px;
    right:8px;

    font-size:9px;

    padding:3px 6px;
  }

  .filter-badge{
    font-size:9px;

    padding:4px 7px;
  }

  .card-info-item{
    font-size:10px;
  }

}


/* ============================================================
   SMALL MOBILE
============================================================ */

@media(max-width:390px){

  .streamer-grid{
    grid-template-columns:1fr;
  }

  .card{
    padding:14px 12px;
  }

  .avatar{
    width:64px;
    height:64px;
  }

  .name{
    font-size:16px;
  }

  .fc-nickname{
    font-size:14px;
  }

  .id-line{
    font-size:11px;
  }

  .card-info-item{
    font-size:11px;
  }

}

</style>
</head>


<body>


<!-- ============================================================
     HEADER
============================================================ -->

<header>

  <div class="hero">

    <div class="hero-content">

      <p class="eyebrow">
        SOOP · FC ONLINE
      </p>

      <h1>
        스트리머 티어보드
      </h1>

      <p class="sub">
        FC온라인 카테고리 스트리머 실력 랭킹
      </p>

    </div>

  </div>


  <div class="controls">

    <input
      type="text"
      id="search"
      placeholder="스트리머 이름 · FC닉네임 · SOOP ID 검색"
    >

    <select id="soopSort">

      <option value="default">
        SOOP TIER순
      </option>

      <option value="soop-asc">
        SOOP TIER 높은순
      </option>

      <option value="soop-desc">
        SOOP TIER 낮은순
      </option>

    </select>


    <select id="fcSort">

      <option value="default">
        FC ONLINE 티어순
      </option>

      <option value="fc-asc">
        FC ONLINE 높은순
      </option>

      <option value="fc-desc">
        FC ONLINE 낮은순
      </option>

    </select>


    <select id="sortSel">

      <option value="tier">
        기본 정렬
      </option>

      <option value="name">
        이름순
      </option>

      <option value="live">
        방송중 우선
      </option>

    </select>

  </div>

</header>


<!-- ============================================================
     FILTERS
============================================================ -->

<div class="filter-panel">

  <!-- SOOP TIER FILTER -->

  <div
    class="filter-row"
    id="soopFilters"
  ></div>


  <!-- FC ONLINE FILTER -->

  <div
    class="filter-row"
    id="fcFilters"
    style="margin-top:7px;"
  ></div>


  <!-- CREW FILTER -->

  <div
    class="filter-row"
    id="crewFilters"
    style="margin-top:7px;"
  ></div>


  <!-- ACTIVE FILTER -->

  <div
    class="active-filters"
    id="activeFilters"
  ></div>

</div>


<!-- ============================================================
     MAIN
============================================================ -->

<main>

  <div class="live-strip">

    <span class="dot"></span>

    <span id="liveCount">
      0명 방송 중
    </span>

  </div>


  <div
    class="streamer-grid"
    id="grid"
  ></div>

</main>


<footer>

  데이터는
  <code>data/streamers.json</code>
  에서 관리합니다.

  <br>

  방송 상태는 60초마다 자동 확인하며,

  FC온라인 공식경기 1on1 티어는
  5분마다 자동 조회합니다.

</footer>


<script>

/* ============================================================
   DATA
============================================================ */

let STREAMERS = [];

const LIVE_REFRESH_MS = 60000;

const TIER_REFRESH_MS = 300000;


/* ============================================================
   FILTER STATE
============================================================ */

const FILTERS = {

  soopTier:null,

  fcTier:null,

  crew:null

};


/* ============================================================
   ELEMENTS
============================================================ */

const grid =
  document.getElementById('grid');

const search =
  document.getElementById('search');

const sortSel =
  document.getElementById('sortSel');

const soopSort =
  document.getElementById('soopSort');

const fcSort =
  document.getElementById('fcSort');

const liveCount =
  document.getElementById('liveCount');

const soopFilters =
  document.getElementById('soopFilters');

const fcFilters =
  document.getElementById('fcFilters');

const crewFilters =
  document.getElementById('crewFilters');

const activeFilters =
  document.getElementById('activeFilters');


/* ============================================================
   ESCAPE
============================================================ */

function escapeHtml(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* ============================================================
   NORMALIZE SOOP TIER
============================================================ */

function normalizeSoopTier(value){

  const text =
    String(value || '').trim();

  if(
    !text ||
    text === '?티어' ||
    text === '100티어'
  ){

    return '티어없음';

  }

  return text;

}


/* ============================================================
   LOAD STREAMERS
============================================================ */

async function loadStreamers(){

  const res =
    await fetch(
      '/data/streamers.json',
      {
        cache:'no-store'
      }
    );

  if(!res.ok){

    throw new Error(
      `streamers.json fetch failed: ${res.status}`
    );

  }

  const data =
    await res.json();

  if(!Array.isArray(data)){

    throw new Error(
      'streamers.json must be an array'
    );

  }

  STREAMERS =
    data

      .filter(
        s => s.active !== false
      )

      .map(s => {

        const divisionId =
          s.divisionId ?? null;

        return {

          id:
            s.id || '',

          name:
            s.name ||
            s.id ||
            '',

          fcNickname:
            s.fcNickname ||
            '',

          tier:
            s.tier || null,

          divisionId:
            divisionId,

          divisionName:
            s.divisionName ||
            null,

          soopTier:
            normalizeSoopTier(
              s.soopTier
            ),

          crew:
            s.crew ||
            null,

          note:
            s.note ||
            '',

          live:false

        };

      });

}


/* ============================================================
   LIVE STATUS
============================================================ */

async function refreshLiveStatus(){

  if(!STREAMERS.length){

    render();

    return;

  }

  const ids =
    STREAMERS

      .map(
        s => s.id
      )

      .filter(Boolean)

      .join(',');

  try{

    const res =
      await fetch(
        `/api/live-status?ids=${encodeURIComponent(ids)}`
      );

    if(!res.ok){

      throw new Error(
        'status fetch failed'
      );

    }

    const data =
      await res.json();

    STREAMERS.forEach(s => {

      if(data[s.id]){

        s.live =
          !!data[s.id].live;

      }

    });

  }catch(err){

    console.warn(
      '실시간 상태 갱신 실패:',
      err
    );

  }

  render();

}


/* ============================================================
   TIER STATUS
============================================================ */

async function refreshTierStatus(){

  const nicknames =
    STREAMERS

      .map(
        s => s.fcNickname
      )

      .filter(Boolean)

      .join(',');

  if(!nicknames){

    render();

    return;

  }

  try{

    const res =
      await fetch(
        `/api/tier?nicknames=${encodeURIComponent(nicknames)}`
      );

    if(!res.ok){

      throw new Error(
        'tier fetch failed'
      );

    }

    const data =
      await res.json();

    STREAMERS.forEach(s => {

      if(!s.fcNickname){

        return;

      }

      const info =
        data[s.fcNickname];

      if(!info){

        return;

      }

      if(info.currentNickname){

        s.fcNickname =
          info.currentNickname;

      }

      if(info.divisionId != null){

        s.divisionId =
          Number(info.divisionId);

      }

      if(
        info.divisionName &&
        info.divisionName !== 'null'
      ){

        s.divisionName =
          info.divisionName;

        s.tier =
          info.divisionName;

      }

      if(
        !s.tier &&
        s.divisionName
      ){

        s.tier =
          s.divisionName;

      }

      if(
        !s.tier &&
        s.divisionId != null
      ){

        s.tier =
          `등급 ${s.divisionId}`;

      }

    });

  }catch(err){

    console.warn(
      '티어 갱신 실패:',
      err
    );

  }

  buildFilterButtons();

  render();

}


/* ============================================================
   DIVISION RANK
============================================================ */

function divisionRank(s){

  return s.divisionId == null
    ? Infinity
    : Number(s.divisionId);

}


/* ============================================================
   SOOP RANK
============================================================ */

function soopRank(s){

  const value =
    String(
      normalizeSoopTier(
        s.soopTier
      )
    );

  const match =
    value.match(/\d+/);

  if(!match){

    return Infinity;

  }

  return Number(match[0]);

}


/* ============================================================
   TIER CLASS
============================================================ */

function tierClass(divisionId){

  if(divisionId == null)
    return 'tier-unranked';

  if(divisionId <= 1300)
    return 'tier-top';

  if(divisionId <= 1900)
    return 'tier-high';

  if(divisionId <= 2200)
    return 'tier-mid';

  if(divisionId <= 2500)
    return 'tier-low';

  return 'tier-basic';

}


/* ============================================================
   SOOP CLASS
============================================================ */

function soopTierClass(tier){

  const value =
    String(tier || '');

  if(value.includes('2티어'))
    return 'soop-2';

  if(value.includes('6티어'))
    return 'soop-6';

  if(value.includes('100티어'))
    return 'soop-100';

  return 'soop-other';

}


/* ============================================================
   CREW CLASS
============================================================ */

const crewColorMap =
  new Map();

function crewClass(crew){

  if(!crew){

    return 'crew-0';

  }

  if(!crewColorMap.has(crew)){

    crewColorMap.set(
      crew,
      crewColorMap.size % 5
    );

  }

  return `crew-${crewColorMap.get(crew)}`;

}


/* ============================================================
   UNIQUE VALUES
============================================================ */

function uniqueValues(key){

  return [

    ...new Set(

      STREAMERS

        .map(
          s => {

            if(key === 'soopTier'){

              return normalizeSoopTier(
                s.soopTier
              );

            }

            return s[key];

          }
        )

        .filter(
          value =>
            value != null &&
            String(value).trim() !== ''
        )

    )

  ];

}


/* ============================================================
   FILTER BUTTONS
============================================================ */

function buildFilterButtons(){

  if(
    !soopFilters ||
    !fcFilters ||
    !crewFilters
  ){

    return;

  }


  /* SOOP */

  const soopValues =
    uniqueValues('soopTier')
      .sort(
        (a,b) =>
          soopRank({
            soopTier:a
          })
          -
          soopRank({
            soopTier:b
          })
      );


  soopFilters.innerHTML = `

    <button
      class="filter-btn ${FILTERS.soopTier === null ? 'active' : ''}"
      data-filter-type="soopTier"
      data-filter-value=""
    >
      SOOP 전체
    </button>

    ${
      soopValues
        .map(
          value => `

            <button
              class="filter-btn ${FILTERS.soopTier === value ? 'active' : ''}"
              data-filter-type="soopTier"
              data-filter-value="${escapeHtml(value)}"
            >
              ${escapeHtml(value)}
            </button>

          `
        )
        .join('')
    }

  `;


  /* FC */

  const fcValues =
    uniqueValues('tier')
      .sort(
        (a,b) => {

          const sa =
            STREAMERS.find(
              s => s.tier === a
            );

          const sb =
            STREAMERS.find(
              s => s.tier === b
            );

          return (
            divisionRank(sa || {}) -
            divisionRank(sb || {})
          );

        }
      );


  fcFilters.innerHTML = `

    <button
      class="filter-btn ${FILTERS.fcTier === null ? 'active' : ''}"
      data-filter-type="fcTier"
      data-filter-value=""
    >
      FC 전체
    </button>

    ${
      fcValues
        .map(
          value => `

            <button
              class="filter-btn ${FILTERS.fcTier === value ? 'active' : ''}"
              data-filter-type="fcTier"
              data-filter-value="${escapeHtml(value)}"
            >
              ${escapeHtml(value)}
            </button>

          `
        )
        .join('')
    }

  `;


  /* CREW */

  const crewValues =
    uniqueValues('crew')
      .sort(
        (a,b) =>
          String(a)
            .localeCompare(
              String(b),
              'ko'
            )
      );


  crewFilters.innerHTML = `

    <button
      class="filter-btn ${FILTERS.crew === null ? 'active' : ''}"
      data-filter-type="crew"
      data-filter-value=""
    >
      CREW 전체
    </button>

    ${
      crewValues
        .map(
          value => `

            <button
              class="filter-btn ${FILTERS.crew === value ? 'active' : ''}"
              data-filter-type="crew"
              data-filter-value="${escapeHtml(value)}"
            >
              ${escapeHtml(value)}
            </button>

          `
        )
        .join('')
    }

  `;


  bindFilterButtons();

}


/* ============================================================
   FILTER EVENTS
============================================================ */

function bindFilterButtons(){

  document
    .querySelectorAll(
      '.filter-btn'
    )
    .forEach(button => {

      button.addEventListener(
        'click',
        () => {

          const type =
            button.dataset.filterType;

          const value =
            button.dataset.filterValue;

          if(type === 'soopTier'){

            FILTERS.soopTier =
              value || null;

          }

          if(type === 'fcTier'){

            FILTERS.fcTier =
              value || null;

          }

          if(type === 'crew'){

            FILTERS.crew =
              value || null;

          }

          buildFilterButtons();

          render();

        }
      );

    });

}


/* ============================================================
   ACTIVE FILTERS
============================================================ */

function renderActiveFilters(){

  if(!activeFilters){

    return;

  }

  const filters = [];


  if(FILTERS.soopTier){

    filters.push({
      type:'soopTier',
      label:`SOOP ${FILTERS.soopTier}`
    });

  }


  if(FILTERS.fcTier){

    filters.push({
      type:'fcTier',
      label:`FC ${FILTERS.fcTier}`
    });

  }


  if(FILTERS.crew){

    filters.push({
      type:'crew',
      label:`CREW ${FILTERS.crew}`
    });

  }


  if(!filters.length){

    activeFilters.classList.remove(
      'has-filter'
    );

    activeFilters.innerHTML = '';

    return;

  }


  activeFilters.classList.add(
    'has-filter'
  );


  activeFilters.innerHTML = `

    <span class="filter-label">
      FILTER
    </span>

    ${
      filters
        .map(
          filter => `

            <button
              class="active-chip"
              data-active-type="${filter.type}"
            >
              ${escapeHtml(filter.label)}
              <span>×</span>
            </button>

          `
        )
        .join('')
    }

    <button
      class="clear-filters"
      id="clearFilters"
    >
      초기화
    </button>

  `;


  activeFilters
    .querySelectorAll('.active-chip')
    .forEach(button => {

      button.addEventListener(
        'click',
        () => {

          FILTERS[
            button.dataset.activeType
          ] = null;

          buildFilterButtons();

          render();

        }
      );

    });


  const clear =
    document.getElementById(
      'clearFilters'
    );

  if(clear){

    clear.addEventListener(
      'click',
      clearAllFilters
    );

  }

}


/* ============================================================
   CLEAR FILTERS
============================================================ */

function clearAllFilters(){

  FILTERS.soopTier = null;

  FILTERS.fcTier = null;

  FILTERS.crew = null;

  buildFilterButtons();

  render();

}


/* ============================================================
   APPLY FILTERS
============================================================ */

function applyFilters(list){

  return list.filter(s => {

    if(
      FILTERS.soopTier &&
      normalizeSoopTier(
        s.soopTier
      ) !== FILTERS.soopTier
    ){

      return false;

    }


    if(
      FILTERS.fcTier &&
      s.tier !== FILTERS.fcTier
    ){

      return false;

    }


    if(
      FILTERS.crew &&
      s.crew !== FILTERS.crew
    ){

      return false;

    }


    return true;

  });

}


/* ============================================================
   SORT
============================================================ */

function sortList(list){

  const mode =
    sortSel.value;

  const soopMode =
    soopSort.value;

  const fcMode =
    fcSort.value;


  /* 이름순 */

  if(mode === 'name'){

    list.sort(
      (a,b) =>
        String(a.name || '')
          .localeCompare(
            String(b.name || ''),
            'ko'
          )
    );

    return;

  }


  /* 방송중 우선 */

  if(mode === 'live'){

    list.sort(
      (a,b) =>
        (Number(b.live) - Number(a.live)) ||
        (divisionRank(a) - divisionRank(b))
    );

    return;

  }


  /* SOOP TIER 명시 정렬 */

  if(soopMode === 'soop-asc'){

    list.sort(
      (a,b) =>
        soopRank(a) - soopRank(b)
    );

    return;

  }


  if(soopMode === 'soop-desc'){

    list.sort(
      (a,b) =>
        soopRank(b) - soopRank(a)
    );

    return;

  }


  /* FC ONLINE 명시 정렬 */

  if(fcMode === 'fc-asc'){

    list.sort(
      (a,b) =>
        divisionRank(a) -
        divisionRank(b)
    );

    return;

  }


  if(fcMode === 'fc-desc'){

    list.sort(
      (a,b) =>
        divisionRank(b) -
        divisionRank(a)
    );

    return;

  }


  /* 기본 */

  list.sort(
    (a,b) =>
      (Number(b.live) - Number(a.live)) ||
      (divisionRank(a) - divisionRank(b))
  );

}


/* ============================================================
   RENDER
============================================================ */

function render(){

  if(
    !grid ||
    !search ||
    !sortSel ||
    !liveCount
  ){

    return;

  }


  const q =
    search.value
      .trim()
      .toLowerCase();


  let list =
    STREAMERS.filter(s => {

      const name =
        String(
          s.name || ''
        ).toLowerCase();

      const id =
        String(
          s.id || ''
        ).toLowerCase();

      const fcNickname =
        String(
          s.fcNickname || ''
        ).toLowerCase();

      const note =
        String(
          s.note || ''
        ).toLowerCase();

      const crew =
        String(
          s.crew || ''
        ).toLowerCase();

      const divisionName =
        String(
          s.divisionName || ''
        ).toLowerCase();

      return (
        name.includes(q) ||
        id.includes(q) ||
        fcNickname.includes(q) ||
        note.includes(q) ||
        crew.includes(q) ||
        divisionName.includes(q)
      );

    });


  list =
    applyFilters(list);


  sortList(list);


  renderActiveFilters();


  liveCount.textContent =
    STREAMERS.filter(
      s => s.live
    ).length +
    '명 방송 중 · 60초마다 자동 갱신';


  if(!list.length){

    grid.innerHTML = `

      <div class="empty">

        <strong>
          조건에 맞는 스트리머가 없습니다.
        </strong>

        검색어나 필터를 확인해주세요.

      </div>

    `;

    return;

  }


  grid.innerHTML =
    list
      .map(
        renderCard
      )
      .join('');


  bindCardFilterButtons();

}


/* ============================================================
   CARD
============================================================ */

function renderCard(s){

  const normalizedSoopTier =
    normalizeSoopTier(
      s.soopTier
    );


  const tierLabel =
    s.tier ||
    (
      s.divisionId != null
        ? `등급 ${s.divisionId}`
        : '불러오는 중…'
    );


  const firstLetter =
    String(
      s.name || '?'
    ).slice(0,1);


  const fcNickname =
    escapeHtml(
      s.fcNickname
    );


  const soopTier =
    escapeHtml(
      normalizedSoopTier
    );


  const crew =
    escapeHtml(
      s.crew
    );


  const note =
    escapeHtml(
      s.note
    );


  const id =
    escapeHtml(
      s.id
    );


  const name =
    escapeHtml(
      s.name
    );


  const safeTier =
    escapeHtml(
      tierLabel
    );


  const divisionName =
    escapeHtml(
      s.divisionName ||
      (
        s.divisionId != null
          ? `Division ${s.divisionId}`
          : ''
      )
    );


  return `

    <article
      class="card ${s.live ? 'live' : ''}"
    >


      <!-- SOOP TIER -->

      <button
        type="button"
        class="card-soop-tier"
        data-filter-type="soopTier"
        data-filter-value="${soopTier}"
        title="이 SOOP 티어만 보기"
      >
        ${soopTier}
      </button>


      <!-- 상단 영역 -->

      <a
        class="streamer-link"
        href="https://ch.sooplive.co.kr/${encodeURIComponent(s.id)}"
        target="_blank"
        rel="noopener"
        aria-label="${name} 방송국 열기"
      >

        <div class="avatar">

          ${firstLetter}

        </div>

      </a>


      <!-- 스트리머 정보 -->

      <div class="meta">


        <!-- 스트리머 이름 -->

        <div class="name-row">

          <a
            class="streamer-link"
            href="https://ch.sooplive.co.kr/${encodeURIComponent(s.id)}"
            target="_blank"
            rel="noopener"
          >

            <span class="name">
              ${name}
            </span>

          </a>


          ${
            s.live
              ? `
                <span class="live-badge">
                  LIVE
                </span>
              `
              : ''
          }

        </div>


        <!-- FC 닉네임 -->

        ${
          s.fcNickname
            ? `

              <div
                class="fc-nickname"
                title="FC온라인 닉네임"
              >

                <span class="fc-ball">
                  ⚽
                </span>

                <span>
                  ${fcNickname}
                </span>

              </div>

            `
            : ''
        }


        <!-- SOOP ID -->

        <div class="id-line">

          @${id}

        </div>


        <!-- FC TIER -->

        <div class="tier-wrap">

          <div class="badge-row">

            <button
              type="button"
              class="filter-badge ${tierClass(s.divisionId)}"
              data-filter-type="fcTier"
              data-filter-value="${safeTier}"
              title="이 FC온라인 티어만 보기"
            >

              ${safeTier}

            </button>

          </div>

        </div>


      </div>


      <!-- ====================================================
           하단 정보

           순서:
           크루명 → Division → Note
      ==================================================== -->

      <div class="card-info-row">

        ${
          s.crew
            ? `

              <button
                type="button"
                class="card-info-item crew-info"
                data-filter-type="crew"
                data-filter-value="${crew}"
                title="이 크루만 보기"
              >
                ${crew}
              </button>

              <span class="card-info-separator">
                ·
              </span>

            `
            : ''
        }


        ${
          divisionName
            ? `

              <span
                class="card-info-item division-info"
                title="${divisionName}"
              >
                ${divisionName}
              </span>

              ${
                s.note
                  ? `
                    <span class="card-info-separator">
                      ·
                    </span>
                  `
                  : ''
              }

            `
            : ''
        }


        ${
          s.note
            ? `

              <span
                class="card-info-item note-info"
                title="${note}"
              >
                ${note}
              </span>

            `
            : ''
        }

      </div>


    </article>

  `;

}


/* ============================================================
   CARD FILTER BUTTONS
============================================================ */

function bindCardFilterButtons(){

  document
    .querySelectorAll(
      '.card .filter-badge, .card .card-soop-tier, .card .crew-info'
    )
    .forEach(button => {

      button.addEventListener(
        'click',
        event => {

          event.preventDefault();

          event.stopPropagation();


          const type =
            button.dataset.filterType;

          const value =
            button.dataset.filterValue;


          if(type === 'soopTier'){

            FILTERS.soopTier =
              FILTERS.soopTier === value
                ? null
                : value;

          }


          if(type === 'fcTier'){

            FILTERS.fcTier =
              FILTERS.fcTier === value
                ? null
                : value;

          }


          if(type === 'crew'){

            FILTERS.crew =
              FILTERS.crew === value
                ? null
                : value;

          }


          buildFilterButtons();

          render();

        }
      );

    });

}


/* ============================================================
   SEARCH
============================================================ */

search.addEventListener(
  'input',
  render
);


/* ============================================================
   SORT
============================================================ */

sortSel.addEventListener(
  'change',
  render
);

soopSort.addEventListener(
  'change',
  render
);

fcSort.addEventListener(
  'change',
  render
);


/* ============================================================
   INITIALIZE
============================================================ */

async function init(){

  try{

    await loadStreamers();

    buildFilterButtons();

    render();


    await refreshLiveStatus();


    await refreshTierStatus();


    setInterval(
      refreshLiveStatus,
      LIVE_REFRESH_MS
    );


    setInterval(
      refreshTierStatus,
      TIER_REFRESH_MS
    );


  }catch(err){

    console.error(
      '초기화 실패:',
      err
    );


    if(grid){

      grid.innerHTML = `

        <div class="empty">

          <strong>
            스트리머 데이터를 불러오지 못했습니다.
          </strong>

          <small>
            ${escapeHtml(err.message)}
          </small>

        </div>

      `;

    }

  }

}


init();

</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC온라인 스트리머 티어보드</title>

<style>

  :root{
    --bg: #0c1210;
    --bg-elev: #121a17;
    --bg-elev-2: #17211d;

    --pitch-line: #22332c;

    --turf: #9bff5c;
    --turf-dim: #6fbf3f;

    --text: #eef5ee;
    --text-dim: #93a89c;

    --plat: #7fe8d4;
    --gold: #f0c34c;
    --silver: #c7d0cd;
    --bronze: #c98b4e;

    --unranked: #5c6b64;

    --card-radius: 14px;

    --font-display:
      'Archivo Black',
      'Pretendard',
      system-ui,
      sans-serif;

    --font-body:
      'Pretendard',
      -apple-system,
      'Noto Sans KR',
      system-ui,
      sans-serif;

    --font-mono:
      'JetBrains Mono',
      'Roboto Mono',
      monospace;
  }


  *{
    box-sizing:border-box;
  }


  body{
    margin:0;

    background:
      radial-gradient(
        circle at 15% -10%,
        rgba(155,255,92,0.10),
        transparent 45%
      ),
      var(--bg);

    color:var(--text);

    font-family:var(--font-body);

    padding-bottom:60px;
  }


  /* ============================================================
     HEADER
  ============================================================ */

  header{
    padding:28px 20px 18px;

    border-bottom:1px solid var(--pitch-line);

    position:sticky;
    top:0;
    z-index:20;

    background:rgba(12,18,16,0.94);

    backdrop-filter:blur(8px);
  }


  .eyebrow{
    font-family:var(--font-mono);

    font-size:11px;

    letter-spacing:0.18em;

    color:var(--turf);

    text-transform:uppercase;

    margin:0 0 6px;
  }


  h1{
    font-family:var(--font-display);

    font-size:clamp(22px,6vw,34px);

    letter-spacing:-0.01em;

    margin:0 0 4px;

    line-height:1.05;
  }


  .sub{
    color:var(--text-dim);

    font-size:13px;

    margin:0;
  }


  /* ============================================================
     CONTROLS
  ============================================================ */

  .controls{
    display:flex;

    gap:8px;

    margin-top:16px;

    flex-wrap:wrap;
  }


  .controls input[type=text]{
    flex:1;

    min-width:160px;

    background:var(--bg-elev);

    border:1px solid var(--pitch-line);

    color:var(--text);

    padding:10px 12px;

    border-radius:10px;

    font-family:var(--font-body);

    font-size:14px;

    outline:none;
  }


  .controls input[type=text]:focus{
    border-color:rgba(155,255,92,0.45);
  }


  select{
    background:var(--bg-elev);

    border:1px solid var(--pitch-line);

    color:var(--text);

    padding:10px 12px;

    border-radius:10px;

    font-size:13px;

    font-family:var(--font-body);

    outline:none;
  }


  /* ============================================================
     FILTER AREA
  ============================================================ */

  .filter-panel{
    max-width:760px;

    margin:0 auto;

    padding:14px 16px 0;
  }


  .filter-scroll{
    display:flex;

    gap:7px;

    overflow-x:auto;

    padding-bottom:2px;

    scrollbar-width:none;
  }


  .filter-scroll::-webkit-scrollbar{
    display:none;
  }


  .filter-btn{
    flex-shrink:0;

    border:1px solid var(--pitch-line);

    background:var(--bg-elev);

    color:var(--text-dim);

    border-radius:9px;

    padding:7px 11px;

    font-size:11px;

    font-family:var(--font-body);

    cursor:pointer;

    transition:
      background .15s,
      border-color .15s,
      color .15s,
      transform .15s;
  }


  .filter-btn:hover{
    border-color:rgba(155,255,92,0.35);

    color:var(--text);
  }


  .filter-btn.active{
    background:rgba(155,255,92,0.10);

    border-color:rgba(155,255,92,0.45);

    color:var(--turf);

    font-weight:700;
  }


  /* ============================================================
     ACTIVE FILTERS
  ============================================================ */

  .active-filters{
    display:none;

    align-items:center;

    gap:6px;

    flex-wrap:wrap;

    margin-top:10px;
  }


  .active-filters.has-filter{
    display:flex;
  }


  .filter-label{
    font-size:10px;

    color:var(--text-dim);

    font-family:var(--font-mono);
  }


  .active-chip{
    display:inline-flex;

    align-items:center;

    gap:5px;

    border-radius:7px;

    padding:4px 7px;

    border:1px solid rgba(155,255,92,0.25);

    background:rgba(155,255,92,0.07);

    color:var(--turf);

    font-size:10px;

    cursor:pointer;
  }


  .active-chip:hover{
    background:rgba(155,255,92,0.12);
  }


  .active-chip .x{
    opacity:.65;

    font-size:10px;
  }


  .clear-filters{
    border:0;

    background:transparent;

    color:var(--text-dim);

    font-size:10px;

    cursor:pointer;

    padding:4px 5px;
  }


  .clear-filters:hover{
    color:var(--text);
  }


  /* ============================================================
     MAIN
  ============================================================ */

  main{
    max-width:760px;

    margin:0 auto;

    padding:18px 16px 0;
  }


  .live-strip{
    display:flex;

    align-items:center;

    gap:8px;

    font-family:var(--font-mono);

    font-size:11px;

    color:var(--text-dim);

    margin:14px 2px 18px;

    letter-spacing:0.04em;
  }


  .dot{
    width:7px;

    height:7px;

    border-radius:50%;

    background:#ff5c5c;

    box-shadow:0 0 8px #ff5c5c;

    animation:pulse 1.6s infinite;
  }


  @keyframes pulse{

    0%,100%{
      opacity:1;
    }

    50%{
      opacity:0.35;
    }

  }


  /* ============================================================
     GROUP HEADER
  ============================================================ */

  .group{
    margin-bottom:24px;
  }


  .group-header{
    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:10px;

    margin:0 2px 10px;

    padding-bottom:9px;

    border-bottom:1px solid var(--pitch-line);
  }


  .group-title{
    font-family:var(--font-display);

    font-size:16px;

    color:var(--text);

    letter-spacing:-0.01em;
  }


  .group-title .accent{
    color:var(--turf);
  }


  .group-count{
    color:var(--text-dim);

    font-family:var(--font-mono);

    font-size:10px;
  }


  /* ============================================================
     GRID
  ============================================================ */

  .grid{
    display:flex;

    flex-direction:column;

    gap:10px;
  }


  /* ============================================================
     CARD
  ============================================================ */

  .card{
    background:var(--bg-elev);

    border:1px solid var(--pitch-line);

    border-radius:var(--card-radius);

    padding:14px;

    display:grid;

    grid-template-columns:44px 1fr auto;

    gap:12px;

    align-items:center;

    text-decoration:none;

    color:inherit;

    transition:
      border-color .15s,
      transform .15s,
      background .15s;

    position:relative;

    overflow:hidden;
  }


  .card:hover{
    border-color:#30463b;

    background:#141e1a;
  }


  .card:active{
    transform:scale(0.99);
  }


  .card.live{
    border-color:rgba(255,92,92,0.5);
  }


  .card.live::before{
    content:"";

    position:absolute;

    left:0;

    top:0;

    bottom:0;

    width:3px;

    background:#ff5c5c;
  }


  /* ============================================================
     AVATAR / BROADCAST LINK
  ============================================================ */

  .streamer-link{
    display:block;

    color:inherit;

    text-decoration:none;

    border-radius:10px;

    outline:none;
  }


  .streamer-link:hover .avatar{
    border-color:rgba(155,255,92,0.45);

    transform:translateY(-1px);
  }


  .streamer-link:hover .name{
    color:var(--turf);
  }


  .avatar{
    width:44px;

    height:44px;

    border-radius:10px;

    background:
      linear-gradient(
        135deg,
        var(--pitch-line),
        #1c2822
      );

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:var(--font-display);

    font-size:15px;

    color:var(--turf-dim);

    overflow:hidden;

    flex-shrink:0;

    border:1px solid transparent;

    transition:
      border-color .15s,
      transform .15s;
  }


  .avatar img{
    width:100%;

    height:100%;

    object-fit:cover;
  }


  /* ============================================================
     META
  ============================================================ */

  .meta{
    min-width:0;
  }


  .name-row{
    display:flex;

    align-items:center;

    gap:6px;

    flex-wrap:wrap;
  }


  .name{
    font-weight:700;

    font-size:15px;

    transition:color .15s;
  }


  .live-badge{
    font-family:var(--font-mono);

    font-size:9px;

    letter-spacing:0.06em;

    background:#ff5c5c;

    color:#1a0a0a;

    padding:2px 6px;

    border-radius:5px;

    font-weight:700;

    flex-shrink:0;
  }


  /* ============================================================
     FC NICKNAME
  ============================================================ */

  .fc-nickname{
    margin-top:4px;

    display:flex;

    align-items:center;

    gap:4px;

    color:var(--turf);

    font-size:14px;

    line-height:1.25;

    font-weight:800;

    letter-spacing:-0.01em;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
  }


  .fc-ball{
    font-size:13px;

    line-height:1;

    flex-shrink:0;
  }


  /* ============================================================
     SOOP ID / NOTE
  ============================================================ */

  .id-line{
    font-family:var(--font-mono);

    font-size:10.5px;

    color:var(--text-dim);

    margin-top:4px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
  }


  /* ============================================================
     BADGES
  ============================================================ */

  .tier-wrap{
    text-align:right;

    flex-shrink:0;

    max-width:220px;
  }


  .badge-row{
    display:flex;

    align-items:center;

    justify-content:flex-end;

    gap:5px;

    flex-wrap:wrap;
  }


  .filter-badge{
    border:0;

    cursor:pointer;

    font-family:var(--font-display);

    font-size:10px;

    letter-spacing:0.02em;

    padding:5px 9px;

    border-radius:8px;

    display:inline-block;

    white-space:nowrap;

    transition:
      transform .12s,
      filter .12s,
      background .12s;
  }


  .filter-badge:hover{
    filter:brightness(1.15);

    transform:translateY(-1px);
  }


  .filter-badge:active{
    transform:scale(.97);
  }


  /* ============================================================
     FC ONLINE TIER COLORS
  ============================================================ */

  .tier-top{
    background:rgba(127,232,212,0.14);

    color:var(--plat);

    border:1px solid rgba(127,232,212,0.35);
  }


  .tier-high{
    background:rgba(140,170,255,0.14);

    color:#a9bcff;

    border:1px solid rgba(140,170,255,0.35);
  }


  .tier-mid{
    background:rgba(240,195,76,0.15);

    color:var(--gold);

    border:1px solid rgba(240,195,76,0.4);
  }


  .tier-low{
    background:rgba(199,208,205,0.12);

    color:var(--silver);

    border:1px solid rgba(199,208,205,0.3);
  }


  .tier-basic{
    background:rgba(201,139,78,0.15);

    color:var(--bronze);

    border:1px solid rgba(201,139,78,0.4);
  }


  .tier-unranked{
    background:rgba(92,107,100,0.15);

    color:var(--unranked);

    border:1px solid rgba(92,107,100,0.3);
  }


  /* ============================================================
     SOOP TIER COLORS
  ============================================================ */

  .soop-badge{
    background:rgba(155,255,92,0.10);

    color:var(--turf);

    border:1px solid rgba(155,255,92,0.30);
  }


  .soop-2{
    background:rgba(127,232,212,0.13);

    color:#7fe8d4;

    border-color:rgba(127,232,212,0.35);
  }


  .soop-6{
    background:rgba(240,195,76,0.13);

    color:#f0c34c;

    border-color:rgba(240,195,76,0.35);
  }


  .soop-100{
    background:rgba(201,139,78,0.13);

    color:#e5a466;

    border-color:rgba(201,139,78,0.35);
  }


  .soop-other{
    background:rgba(155,255,92,0.08);

    color:var(--turf);

    border-color:rgba(155,255,92,0.25);
  }


  /* ============================================================
     CREW COLORS
  ============================================================ */

  .crew-badge{
    background:rgba(190,160,255,0.10);

    color:#cdb7ff;

    border:1px solid rgba(190,160,255,0.30);
  }


  .crew-0{
    background:rgba(190,160,255,0.10);

    color:#cdb7ff;

    border-color:rgba(190,160,255,0.30);
  }


  .crew-1{
    background:rgba(255,150,190,0.10);

    color:#ff9fc0;

    border-color:rgba(255,150,190,0.30);
  }


  .crew-2{
    background:rgba(100,190,255,0.10);

    color:#7fc9ff;

    border-color:rgba(100,190,255,0.30);
  }


  .crew-3{
    background:rgba(255,190,100,0.10);

    color:#ffc56f;

    border-color:rgba(255,190,100,0.30);
  }


  .crew-4{
    background:rgba(130,220,160,0.10);

    color:#8ee0a6;

    border-color:rgba(130,220,160,0.30);
  }


  /* ============================================================
     EMPTY
  ============================================================ */

  .empty{
    text-align:center;

    padding:40px 20px;

    color:var(--text-dim);

    font-size:13px;
  }


  .empty strong{
    display:block;

    color:var(--text);

    margin-bottom:5px;
  }


  /* ============================================================
     FOOTER
  ============================================================ */

  footer{
    max-width:760px;

    margin:28px auto 0;

    padding:0 16px;

    font-family:var(--font-mono);

    font-size:11px;

    color:var(--text-dim);

    line-height:1.6;
  }


  footer code{
    background:var(--bg-elev);

    padding:1px 5px;

    border-radius:4px;
  }


  /* ============================================================
     MOBILE
  ============================================================ */

  @media(max-width:560px){

    .card{
      grid-template-columns:44px 1fr auto;

      gap:10px;

      padding:13px 12px;
    }


    .tier-wrap{
      max-width:145px;
    }


    .filter-badge{
      font-size:9px;

      padding:5px 7px;
    }


    .fc-nickname{
      font-size:14px;
    }

  }

</style>
</head>


<body>


<header>

  <p class="eyebrow">
    SOOP · FC ONLINE
  </p>

  <h1>
    스트리머 티어보드
  </h1>

  <p class="sub">
    FC온라인 카테고리 스트리머 실력 랭킹
  </p>


  <div class="controls">

    <input
      type="text"
      id="search"
      placeholder="스트리머 이름 검색"
    >


    <select id="sortSel">

      <option value="tier">
        티어순
      </option>

      <option value="name">
        이름순
      </option>

      <option value="live">
        방송중 우선
      </option>

    </select>

  </div>

</header>



<div class="filter-panel">

  <div
    class="filter-scroll"
    id="soopFilters"
  ></div>


  <div
    class="filter-scroll"
    id="fcFilters"
    style="margin-top:7px;"
  ></div>


  <div
    class="filter-scroll"
    id="crewFilters"
    style="margin-top:7px;"
  ></div>


  <div
    class="active-filters"
    id="activeFilters"
  ></div>

</div>



<main>

  <div class="live-strip">

    <span class="dot"></span>

    <span id="liveCount">
      0명 방송 중
    </span>

  </div>


  <div
    class="grid"
    id="grid"
  ></div>

</main>



<footer>

  데이터는
  <code>data/streamers.json</code>
  에서 관리합니다.

  <br>

  방송 상태는 60초마다 자동 확인하며,

  FC온라인 공식경기 1on1 티어는
  5분마다 자동 조회합니다.

</footer>



<script>


/* ============================================================
   DATA
============================================================ */

let STREAMERS = [];

const LIVE_REFRESH_MS = 60000;

const TIER_REFRESH_MS = 300000;



/* ============================================================
   FILTER STATE
============================================================ */

const FILTERS = {

  soopTier: null,

  fcTier: null,

  crew: null

};



/* ============================================================
   HTML ELEMENTS
============================================================ */

const grid =
  document.getElementById('grid');

const search =
  document.getElementById('search');

const sortSel =
  document.getElementById('sortSel');

const liveCount =
  document.getElementById('liveCount');

const soopFilters =
  document.getElementById('soopFilters');

const fcFilters =
  document.getElementById('fcFilters');

const crewFilters =
  document.getElementById('crewFilters');

const activeFilters =
  document.getElementById('activeFilters');



/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(value){

  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}



/* ============================================================
   SOOP TIER NORMALIZE
============================================================ */

function normalizeSoopTier(value){

  if(value == null){

    return null;

  }


  const text =
    String(value).trim();


  if(
    !text ||
    text === '?티어' ||
    text === '100티어' ||
    text.includes('?티어')
  ){

    return '티어없음';

  }


  return text;

}



/* ============================================================
   SOOP TIER RANK
============================================================ */

function soopTierRank(value){

  const normalized =
    normalizeSoopTier(value);


  if(
    !normalized ||
    normalized === '티어없음'
  ){

    return Infinity;

  }


  const match =
    String(normalized)
      .match(/(\d+)/);


  if(!match){

    return Infinity;

  }


  return Number(match[1]);

}



/* ============================================================
   FC DIVISION LABEL
============================================================ */

function getDivisionLabel(s){

  if(
    s.divisionName &&
    String(s.divisionName).trim() !== '' &&
    String(s.divisionName) !== 'null'
  ){

    return String(s.divisionName).trim();

  }


  if(s.tier){

    const tier =
      String(s.tier).trim();


    if(
      tier !== '100티어' &&
      tier !== '?티어' &&
      tier !== '티어없음'
    ){

      return tier;

    }

  }


  if(s.divisionId != null){

    return `등급 ${s.divisionId}`;

  }


  return '티어없음';

}



/* ============================================================
   STREAMERS.JSON
============================================================ */

async function loadStreamers(){

  const res =
    await fetch(
      '/data/streamers.json',
      {
        cache:'no-store'
      }
    );


  if(!res.ok){

    throw new Error(
      `streamers.json fetch failed: ${res.status}`
    );

  }


  const data =
    await res.json();


  if(!Array.isArray(data)){

    throw new Error(
      'streamers.json must be an array'
    );

  }


  STREAMERS =
    data

      .filter(
        s => s.active !== false
      )

      .map(s => {

        const divisionId =
          s.divisionId ?? null;


        return {

          id:
            s.id || '',

          name:
            s.name ||
            s.id ||
            '',

          fcNickname:
            s.fcNickname ||
            '',

          tier:
            s.tier ||
            null,

          divisionId:
            divisionId,

          divisionName:
            s.divisionName ||
            null,

          soopTier:
            normalizeSoopTier(
              s.soopTier
            ),

          crew:
            s.crew ||
            null,

          note:
            s.note ||
            '',

          live:false

        };

      });

}



/* ============================================================
   LIVE STATUS
============================================================ */

async function refreshLiveStatus(){

  if(!STREAMERS.length){

    render();

    return;

  }


  const ids =
    STREAMERS

      .map(
        s => s.id
      )

      .filter(Boolean)

      .join(',');


  try{

    const res =
      await fetch(
        `/api/live-status?ids=${encodeURIComponent(ids)}`
      );


    if(!res.ok){

      throw new Error(
        'status fetch failed'
      );

    }


    const data =
      await res.json();


    STREAMERS.forEach(s => {

      if(data[s.id]){

        s.live =
          !!data[s.id].live;

      }

    });


  }catch(err){

    console.warn(
      '실시간 상태 갱신 실패, 이전 상태 유지:',
      err
    );

  }


  render();

}



/* ============================================================
   TIER STATUS
============================================================ */

async function refreshTierStatus(){

  const nicknames =
    STREAMERS

      .map(
        s => s.fcNickname
      )

      .filter(Boolean)

      .join(',');


  if(!nicknames){

    render();

    return;

  }


  try{

    const res =
      await fetch(
        `/api/tier?nicknames=${encodeURIComponent(nicknames)}`
      );


    if(!res.ok){

      throw new Error(
        'tier fetch failed'
      );

    }


    const data =
      await res.json();


    STREAMERS.forEach(s => {

      if(!s.fcNickname){

        return;

      }


      const info =
        data[s.fcNickname];


      if(!info){

        return;

      }


      /* 현재 닉네임 */

      if(info.currentNickname){

        s.fcNickname =
          info.currentNickname;

      }


      /* divisionId */

      if(info.divisionId != null){

        s.divisionId =
          Number(info.divisionId);

      }


      /* divisionName */

      if(
        info.divisionName &&
        info.divisionName !== 'null'
      ){

        s.divisionName =
          info.divisionName;

        s.tier =
          info.divisionName;

      }


      /* fallback */

      if(
        !s.tier &&
        s.divisionName
      ){

        s.tier =
          s.divisionName;

      }


      if(
        !s.tier &&
        s.divisionId != null
      ){

        s.tier =
          `등급 ${s.divisionId}`;

      }

    });


  }catch(err){

    console.warn(
      '티어 갱신 실패, 기존 데이터 유지:',
      err
    );

  }


  buildFilterButtons();

  render();

}



/* ============================================================
   DIVISION RANK
   낮은 divisionId = 높은 티어
============================================================ */

function divisionRank(s){

  if(s.divisionId == null){

    return Infinity;

  }


  const value =
    Number(s.divisionId);


  return Number.isFinite(value)
    ? value
    : Infinity;

}



/* ============================================================
   FC TIER CLASS
============================================================ */

function tierClass(divisionId){

  if(divisionId == null){

    return 'tier-unranked';

  }


  if(divisionId <= 1300){

    return 'tier-top';

  }


  if(divisionId <= 1900){

    return 'tier-high';

  }


  if(divisionId <= 2200){

    return 'tier-mid';

  }


  if(divisionId <= 2500){

    return 'tier-low';

  }


  return 'tier-basic';

}



/* ============================================================
   SOOP TIER CLASS
============================================================ */

function soopTierClass(tier){

  const value =
    normalizeSoopTier(tier);


  if(value === '티어없음'){

    return 'soop-other';

  }


  if(
    String(value)
      .includes('2티어')
  ){

    return 'soop-2';

  }


  if(
    String(value)
      .includes('6티어')
  ){

    return 'soop-6';

  }


  return 'soop-other';

}



/* ============================================================
   CREW CLASS
============================================================ */

const crewColorMap =
  new Map();


function crewClass(crew){

  if(!crew){

    return 'crew-0';

  }


  if(!crewColorMap.has(crew)){

    crewColorMap.set(
      crew,
      crewColorMap.size % 5
    );

  }


  return `crew-${crewColorMap.get(crew)}`;

}



/* ============================================================
   UNIQUE SOOP VALUES
============================================================ */

function uniqueSoopValues(){

  const values =
    [
      ...new Set(
        STREAMERS
          .map(
            s => normalizeSoopTier(
              s.soopTier
            )
          )
          .filter(Boolean)
      )
    ];


  return values.sort(
    (a,b) => {

      const rankA =
        soopTierRank(a);

      const rankB =
        soopTierRank(b);


      if(rankA !== rankB){

        return rankA - rankB;

      }


      return String(a)
        .localeCompare(
          String(b),
          'ko'
        );

    }
  );

}



/* ============================================================
   UNIQUE FC VALUES
   divisionId 기준으로 정렬
============================================================ */

function uniqueFcValues(){

  const map =
    new Map();


  STREAMERS.forEach(s => {

    const label =
      getDivisionLabel(s);


    if(!label){

      return;

    }


    /*
     * 같은 divisionName을 가진 사람은
     * 하나의 필터로 묶음
     */

    if(!map.has(label)){

      map.set(
        label,
        {
          label,
          divisionId:
            s.divisionId
        }
      );

    }


    /*
     * 동일 이름인데 divisionId가 다르면
     * 더 높은 티어(작은 ID)를 사용
     */

    const current =
      map.get(label);


    if(
      current.divisionId == null ||
      (
        s.divisionId != null &&
        Number(s.divisionId) <
        Number(current.divisionId)
      )
    ){

      current.divisionId =
        s.divisionId;

    }

  });


  return [...map.values()]
    .sort(
      (a,b) => {

        const rankA =
          a.divisionId == null
            ? Infinity
            : Number(a.divisionId);

        const rankB =
          b.divisionId == null
            ? Infinity
            : Number(b.divisionId);


        if(rankA !== rankB){

          return rankA - rankB;

        }


        return String(a.label)
          .localeCompare(
            String(b.label),
            'ko'
          );

      }
    );

}



/* ============================================================
   UNIQUE CREW VALUES
============================================================ */

function uniqueCrewValues(){

  return [
    ...new Set(

      STREAMERS

        .map(
          s => s.crew
        )

        .filter(
          value =>
            value != null &&
            String(value).trim() !== ''
        )

    )
  ].sort(
    (a,b) =>
      String(a).localeCompare(
        String(b),
        'ko'
      )
  );

}



/* ============================================================
   FILTER BUTTONS
============================================================ */

function buildFilterButtons(){

  if(
    !soopFilters ||
    !fcFilters ||
    !crewFilters
  ){

    return;

  }


  /* ==========================================================
     SOOP TIER
  ========================================================== */

  const soopValues =
    uniqueSoopValues();


  soopFilters.innerHTML = `

    <button
      class="filter-btn ${
        FILTERS.soopTier === null
          ? 'active'
          : ''
      }"
      data-filter-type="soopTier"
      data-filter-value=""
    >
      SOOP 전체
    </button>

    ${
      soopValues
        .map(value => `

          <button
            class="filter-btn ${
              FILTERS.soopTier === value
                ? 'active'
                : ''
            }"
            data-filter-type="soopTier"
            data-filter-value="${escapeHtml(value)}"
          >
            ${escapeHtml(value)}
          </button>

        `)
        .join('')
    }

  `;



  /* ==========================================================
     FC ONLINE TIER
  ========================================================== */

  const fcValues =
    uniqueFcValues();


  fcFilters.innerHTML = `

    <button
      class="filter-btn ${
        FILTERS.fcTier === null
          ? 'active'
          : ''
      }"
      data-filter-type="fcTier"
      data-filter-value=""
    >
      FC 전체
    </button>

    ${
      fcValues
        .map(item => `

          <button
            class="filter-btn ${
              FILTERS.fcTier === item.label
                ? 'active'
                : ''
            }"
            data-filter-type="fcTier"
            data-filter-value="${escapeHtml(item.label)}"
          >
            ${escapeHtml(item.label)}
          </button>

        `)
        .join('')
    }

  `;



  /* ==========================================================
     CREW
  ========================================================== */

  const crewValues =
    uniqueCrewValues();


  crewFilters.innerHTML = `

    <button
      class="filter-btn ${
        FILTERS.crew === null
          ? 'active'
          : ''
      }"
      data-filter-type="crew"
      data-filter-value=""
    >
      CREW 전체
    </button>

    ${
      crewValues
        .map(value => `

          <button
            class="filter-btn ${
              FILTERS.crew === value
                ? 'active'
                : ''
            }"
            data-filter-type="crew"
            data-filter-value="${escapeHtml(value)}"
          >
            ${escapeHtml(value)}
          </button>

        `)
        .join('')
    }

  `;


  bindFilterButtons();

}



/* ============================================================
   FILTER BUTTON EVENTS
============================================================ */

function bindFilterButtons(){

  document
    .querySelectorAll('.filter-btn')
    .forEach(button => {

      button.addEventListener(
        'click',
        () => {

          const type =
            button.dataset.filterType;


          const value =
            button.dataset.filterValue;


          if(type === 'soopTier'){

            FILTERS.soopTier =
              value || null;

          }


          if(type === 'fcTier'){

            FILTERS.fcTier =
              value || null;

          }


          if(type === 'crew'){

            FILTERS.crew =
              value || null;

          }


          render();

        }
      );

    });

}



/* ============================================================
   ACTIVE FILTER DISPLAY
============================================================ */

function renderActiveFilters(){

  if(!activeFilters){

    return;

  }


  const filters = [];


  if(FILTERS.soopTier){

    filters.push({

      type:'soopTier',

      label:
        `SOOP ${FILTERS.soopTier}`

    });

  }


  if(FILTERS.fcTier){

    filters.push({

      type:'fcTier',

      label:
        `FC ${FILTERS.fcTier}`

    });

  }


  if(FILTERS.crew){

    filters.push({

      type:'crew',

      label:
        `CREW ${FILTERS.crew}`

    });

  }


  if(!filters.length){

    activeFilters.classList.remove(
      'has-filter'
    );

    activeFilters.innerHTML = '';

    return;

  }


  activeFilters.classList.add(
    'has-filter'
  );


  activeFilters.innerHTML = `

    <span class="filter-label">
      FILTER
    </span>

    ${
      filters
        .map(filter => `

          <button
            class="active-chip"
            data-active-type="${filter.type}"
          >

            ${escapeHtml(filter.label)}

            <span class="x">
              ×
            </span>

          </button>

        `)
        .join('')
    }

    <button
      class="clear-filters"
      id="clearFilters"
    >
      초기화
    </button>

  `;


  activeFilters
    .querySelectorAll('.active-chip')
    .forEach(button => {

      button.addEventListener(
        'click',
        () => {

          const type =
            button.dataset.activeType;


          FILTERS[type] = null;


          buildFilterButtons();

          render();

        }
      );

    });


  const clear =
    document.getElementById(
      'clearFilters'
    );


  if(clear){

    clear.addEventListener(
      'click',
      clearAllFilters
    );

  }

}



/* ============================================================
   CLEAR FILTERS
============================================================ */

function clearAllFilters(){

  FILTERS.soopTier = null;

  FILTERS.fcTier = null;

  FILTERS.crew = null;


  buildFilterButtons();

  render();

}



/* ============================================================
   FILTER STREAMERS
============================================================ */

function applyFilters(list){

  return list.filter(s => {


    /* SOOP TIER */

    if(FILTERS.soopTier){

      const streamerSoopTier =
        normalizeSoopTier(
          s.soopTier
        );


      if(
        streamerSoopTier !==
        FILTERS.soopTier
      ){

        return false;

      }

    }



    /* FC TIER */

    if(FILTERS.fcTier){

      const streamerFcTier =
        getDivisionLabel(s);


      if(
        streamerFcTier !==
        FILTERS.fcTier
      ){

        return false;

      }

    }



    /* CREW */

    if(FILTERS.crew){

      if(
        s.crew !==
        FILTERS.crew
      ){

        return false;

      }

    }


    return true;

  });

}



/* ============================================================
   SORT
============================================================ */

function sortList(list){

  const mode =
    sortSel.value;


  if(mode === 'name'){

    list.sort(
      (a,b) =>
        String(a.name || '')
          .localeCompare(
            String(b.name || ''),
            'ko'
          )
    );


    return;

  }


  /*
   * 방송중 우선
   * 그 안에서 FC 티어 높은 순
   */

  list.sort(
    (a,b) =>

      (Number(b.live) -
       Number(a.live))

      ||

      (
        divisionRank(a) -
        divisionRank(b)
      )

      ||

      (
        soopTierRank(a.soopTier) -
        soopTierRank(b.soopTier)
      )

  );

}



/* ============================================================
   SOOP GROUPING
============================================================ */

function getGroupInfo(list){

  /*
   * SOOP Tier 필터가 선택되어 있으면
   * 선택된 Tier 하나만 표시
   */

  if(FILTERS.soopTier){

    return [

      {

        title:
          `SOOP TIER · ${FILTERS.soopTier}`,

        items:list

      }

    ];

  }



  /*
   * SOOP Tier별 그룹
   */

  const groups =
    new Map();


  list.forEach(s => {

    const tier =
      normalizeSoopTier(
        s.soopTier
      ) || '티어없음';


    if(!groups.has(tier)){

      groups.set(
        tier,
        []
      );

    }


    groups
      .get(tier)
      .push(s);

  });



  const result = [];


  /*
   * SOOP Tier 높은 순
   */

  const sortedKeys =
    [...groups.keys()]
      .sort(
        (a,b) => {

          const rankA =
            soopTierRank(a);

          const rankB =
            soopTierRank(b);


          if(rankA !== rankB){

            return rankA - rankB;

          }


          return String(a)
            .localeCompare(
              String(b),
              'ko'
            );

        }
      );



  sortedKeys.forEach(key => {

    result.push({

      title:
        `SOOP TIER · ${key}`,

      items:
        groups.get(key)

    });

  });


  return result;

}



/* ============================================================
   RENDER
============================================================ */

function render(){

  if(
    !grid ||
    !search ||
    !sortSel ||
    !liveCount
  ){

    console.error(
      '화면 요소를 찾지 못했습니다.'
    );

    return;

  }


  const q =
    search.value
      .trim()
      .toLowerCase();


  let list =
    STREAMERS.filter(s => {

      const name =
        String(
          s.name || ''
        ).toLowerCase();


      const id =
        String(
          s.id || ''
        ).toLowerCase();


      const fcNickname =
        String(
          s.fcNickname || ''
        ).toLowerCase();


      const note =
        String(
          s.note || ''
        ).toLowerCase();


      const crew =
        String(
          s.crew || ''
        ).toLowerCase();


      const divisionName =
        String(
          getDivisionLabel(s) || ''
        ).toLowerCase();


      const soopTier =
        String(
          normalizeSoopTier(
            s.soopTier
          ) || ''
        ).toLowerCase();


      return (

        name.includes(q) ||

        id.includes(q) ||

        fcNickname.includes(q) ||

        note.includes(q) ||

        crew.includes(q) ||

        divisionName.includes(q) ||

        soopTier.includes(q)

      );

    });



  /* 필터 */

  list =
    applyFilters(list);



  /* 정렬 */

  sortList(list);



  /* 활성 필터 */

  renderActiveFilters();



  /* LIVE */

  liveCount.textContent =

    STREAMERS.filter(
      s => s.live
    ).length +

    '명 방송 중 (60초마다 자동 갱신)';



  /* 결과 없음 */

  if(!list.length){

    grid.innerHTML = `

      <div class="empty">

        <strong>
          조건에 맞는 스트리머가 없습니다.
        </strong>

        검색어나 필터를 확인해주세요.

      </div>

    `;

    return;

  }



  /* SOOP GROUP */

  const groups =
    getGroupInfo(list);


  grid.innerHTML =
    groups
      .map(group => {

        return `

          <section class="group">

            <div class="group-header">

              <div class="group-title">

                <span class="accent">
                  ${escapeHtml(
                    group.title
                      .split('·')[0]
                  )}
                </span>

                ${
                  group.title.includes('·')
                    ? `
                      ·
                      ${escapeHtml(
                        group.title
                          .split('·')
                          .slice(1)
                          .join('·')
                          .trim()
                      )}
                    `
                    : ''
                }

              </div>

              <div class="group-count">

                ${group.items.length}명

              </div>

            </div>


            <div class="grid">

              ${group.items
                .map(
                  renderCard
                )
                .join('')}

            </div>

          </section>

        `;

      })
      .join('');


  bindCardFilterButtons();

}



/* ============================================================
   CARD RENDER
============================================================ */

function renderCard(s){

  const tierLabel =
    getDivisionLabel(s);


  const firstLetter =
    String(
      s.name || '?'
    ).slice(0,1);


  const fcNickname =
    escapeHtml(
      s.fcNickname
    );


  const normalizedSoopTier =
    normalizeSoopTier(
      s.soopTier
    );


  const soopTier =
    escapeHtml(
      normalizedSoopTier
    );


  const crew =
    escapeHtml(
      s.crew
    );


  const note =
    escapeHtml(
      s.note
    );


  const id =
    escapeHtml(
      s.id
    );


  const name =
    escapeHtml(
      s.name
    );


  const safeTier =
    escapeHtml(
      tierLabel
    );


  return `

    <article
      class="card ${s.live ? 'live' : ''}"
    >


      <!-- 썸네일 -->

      <a
        class="streamer-link"
        href="https://ch.sooplive.co.kr/${encodeURIComponent(s.id)}"
        target="_blank"
        rel="noopener"
        aria-label="${name} 방송국 열기"
      >

        <div class="avatar">

          ${firstLetter}

        </div>

      </a>



      <div class="meta">


        <!-- 스트리머 이름 -->

        <div class="name-row">

          <a
            class="streamer-link"
            href="https://ch.sooplive.co.kr/${encodeURIComponent(s.id)}"
            target="_blank"
            rel="noopener"
          >

            <span class="name">
              ${name}
            </span>

          </a>


          ${
            s.live
              ? `
                <span class="live-badge">
                  LIVE
                </span>
              `
              : ''
          }

        </div>



        <!-- FC NICKNAME -->

        ${
          s.fcNickname
            ? `

              <div
                class="fc-nickname"
                title="FC온라인 닉네임"
              >

                <span class="fc-ball">
                  ⚽
                </span>

                <span>
                  ${fcNickname}
                </span>

              </div>

            `
            : ''
        }



        <!-- SOOP ID + NOTE -->

        <div class="id-line">

          @${id}

          ${
            note
              ? ` · ${note}`
              : ''
          }

        </div>


      </div>



      <!-- 필터 배지 -->

      <div class="tier-wrap">

        <div class="badge-row">


          <!-- FC ONLINE TIER -->

          <button
            type="button"
            class="filter-badge ${tierClass(s.divisionId)}"
            data-filter-type="fcTier"
            data-filter-value="${safeTier}"
            title="이 FC온라인 티어만 보기"
          >

            ${safeTier}

          </button>



          <!-- SOOP TIER -->

          ${
            normalizedSoopTier
              ? `

                <button
                  type="button"
                  class="filter-badge soop-badge ${soopTierClass(normalizedSoopTier)}"
                  data-filter-type="soopTier"
                  data-filter-value="${soopTier}"
                  title="이 SOOP 티어만 보기"
                >

                  ${soopTier}

                </button>

              `
              : ''
          }



          <!-- CREW -->

          ${
            s.crew
              ? `

                <button
                  type="button"
                  class="filter-badge crew-badge ${crewClass(s.crew)}"
                  data-filter-type="crew"
                  data-filter-value="${crew}"
                  title="이 크루만 보기"
                >

                  ${crew}

                </button>

              `
              : ''
          }


        </div>

      </div>


    </article>

  `;

}



/* ============================================================
   CARD FILTER BUTTON EVENTS
============================================================ */

function bindCardFilterButtons(){

  document
    .querySelectorAll(
      '.card .filter-badge'
    )
    .forEach(button => {

      button.addEventListener(
        'click',
        event => {

          event.preventDefault();

          event.stopPropagation();


          const type =
            button.dataset.filterType;


          const value =
            button.dataset.filterValue;


          if(type === 'soopTier'){

            FILTERS.soopTier =
              FILTERS.soopTier === value
                ? null
                : value;

          }


          if(type === 'fcTier'){

            FILTERS.fcTier =
              FILTERS.fcTier === value
                ? null
                : value;

          }


          if(type === 'crew'){

            FILTERS.crew =
              FILTERS.crew === value
                ? null
                : value;

          }


          buildFilterButtons();

          render();

        }
      );

    });

}



/* ============================================================
   SEARCH
============================================================ */

search.addEventListener(
  'input',
  render
);



/* ============================================================
   SORT
============================================================ */

sortSel.addEventListener(
  'change',
  render
);



/* ============================================================
   INITIALIZE
============================================================ */

async function init(){

  try{

    await loadStreamers();


    buildFilterButtons();

    render();


    await refreshLiveStatus();


    await refreshTierStatus();


    setInterval(
      refreshLiveStatus,
      LIVE_REFRESH_MS
    );


    setInterval(
      refreshTierStatus,
      TIER_REFRESH_MS
    );


  }catch(err){

    console.error(
      '초기화 실패:',
      err
    );


    if(grid){

      grid.innerHTML = `

        <div class="empty">

          <strong>
            스트리머 데이터를 불러오지 못했습니다.
          </strong>

          <small>
            ${escapeHtml(
              err.message
            )}
          </small>

        </div>

      `;

    }

  }

}



init();

</script>

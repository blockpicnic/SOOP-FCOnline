<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC온라인 스트리머 티어보드</title>

<!-- Noto Sans KR -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap"
  rel="stylesheet"
>

<style>

/* ============================================================
   ROOT
============================================================ */

:root{

  --bg:#0c1210;
  --bg-elev:#121a17;
  --bg-elev-2:#17211d;

  --pitch-line:#22332c;

  --turf:#9bff5c;
  --turf-dim:#6fbf3f;

  --text:#eef5ee;
  --text-dim:#93a89c;

  --unranked:#5c6b64;

  --card-radius:14px;

  --font-display:
    'Noto Sans KR',
    system-ui,
    sans-serif;

  --font-body:
    'Noto Sans KR',
    -apple-system,
    BlinkMacSystemFont,
    system-ui,
    sans-serif;

  --font-mono:
    'JetBrains Mono',
    'Noto Sans KR',
    monospace;
}



/* ============================================================
   RESET
============================================================ */

*{
  box-sizing:border-box;
}

html{
  -webkit-text-size-adjust:100%;
}

body{

  margin:0;

  background:
    radial-gradient(
      circle at 15% -10%,
      rgba(155,255,92,.10),
      transparent 45%
    ),
    var(--bg);

  color:var(--text);

  font-family:var(--font-body);

  padding-bottom:60px;

}



/* ============================================================
   HEADER
============================================================ */

header{

  padding:28px 20px 20px;

  border-bottom:1px solid var(--pitch-line);

  position:sticky;

  top:0;

  z-index:20;

  background:rgba(12,18,16,.95);

  backdrop-filter:blur(10px);

}



/* ============================================================
   HERO
============================================================ */

.hero{

  position:relative;

  max-width:1000px;

  margin:0 auto;

  padding:28px 24px 24px;

  overflow:hidden;

  border-radius:16px;

  background:
    linear-gradient(
      90deg,
      rgba(12,18,16,.97),
      rgba(12,18,16,.82),
      rgba(12,18,16,.94)
    ),
    url('/assets/fconline-bg.jpg')
    center/cover no-repeat;

  border:1px solid rgba(155,255,92,.12);

}

.hero::after{

  content:"";

  position:absolute;

  inset:0;

  pointer-events:none;

  background:
    linear-gradient(
      135deg,
      rgba(155,255,92,.08),
      transparent 45%
    );

}

.hero-content{

  position:relative;

  z-index:1;

}

.eyebrow{

  font-family:var(--font-mono);

  font-size:12px;

  letter-spacing:.18em;

  color:var(--turf);

  text-transform:uppercase;

  margin:0 0 6px;

}

h1{

  font-family:var(--font-display);

  font-size:clamp(24px,6vw,36px);

  letter-spacing:-.03em;

  margin:0 0 5px;

  line-height:1.1;

  font-weight:900;

}

.sub{

  color:var(--text-dim);

  font-size:14px;

  margin:0;

}



/* ============================================================
   CONTROLS
============================================================ */

.controls{

  display:flex;

  gap:8px;

  margin:14px auto 0;

  max-width:1000px;

  flex-wrap:wrap;

  justify-content:flex-start;

}

.controls input[type=text]{

  flex:1;

  min-width:180px;

  background:var(--bg-elev);

  border:1px solid var(--pitch-line);

  color:var(--text);

  padding:11px 13px;

  border-radius:10px;

  font-family:var(--font-body);

  font-size:14px;

  outline:none;

}

.controls input[type=text]:focus{

  border-color:rgba(155,255,92,.45);

}

select{

  background:var(--bg-elev);

  border:1px solid var(--pitch-line);

  color:var(--text);

  padding:11px 13px;

  border-radius:10px;

  font-size:14px;

  font-family:var(--font-body);

  outline:none;

  cursor:pointer;

}



/* ============================================================
   FILTER PANEL
============================================================ */

.filter-panel{

  max-width:1000px;

  margin:0 auto;

  padding:14px 20px 0;

  text-align:left;

}

.filter-row{

  display:flex;

  align-items:center;

  justify-content:flex-start;

  gap:7px;

  overflow-x:auto;

  scrollbar-width:none;

  padding-bottom:3px;

}

.filter-row::-webkit-scrollbar{

  display:none;

}

.filter-btn{

  flex-shrink:0;

  border:1px solid var(--pitch-line);

  background:var(--bg-elev);

  color:var(--text-dim);

  border-radius:9px;

  padding:8px 12px;

  font-size:12px;

  font-family:var(--font-body);

  cursor:pointer;

  transition:.15s;

}

.filter-btn:hover{

  border-color:rgba(155,255,92,.35);

  color:var(--text);

}

.filter-btn.active{

  background:rgba(155,255,92,.10);

  border-color:rgba(155,255,92,.45);

  color:var(--turf);

  font-weight:700;

}



/* ============================================================
   ACTIVE FILTER
============================================================ */

.active-filters{

  display:none;

  align-items:center;

  gap:6px;

  flex-wrap:wrap;

  margin-top:10px;

}

.active-filters.has-filter{

  display:flex;

}

.filter-label{

  font-size:11px;

  color:var(--text-dim);

  font-family:var(--font-mono);

}

.active-chip{

  display:inline-flex;

  align-items:center;

  gap:5px;

  border-radius:7px;

  padding:5px 8px;

  border:1px solid rgba(155,255,92,.25);

  background:rgba(155,255,92,.07);

  color:var(--turf);

  font-size:11px;

  cursor:pointer;

}

.clear-filters{

  border:0;

  background:transparent;

  color:var(--text-dim);

  font-size:11px;

  cursor:pointer;

}



/* ============================================================
   MAIN
============================================================ */

main{

  max-width:1000px;

  margin:0 auto;

  padding:18px 20px 0;

}

.live-strip{

  display:flex;

  align-items:center;

  gap:8px;

  font-family:var(--font-mono);

  font-size:12px;

  color:var(--text-dim);

  margin:8px 2px 16px;

  letter-spacing:.04em;

}

.dot{

  width:7px;

  height:7px;

  border-radius:50%;

  background:#ff5c5c;

  box-shadow:0 0 8px #ff5c5c;

  animation:pulse 1.6s infinite;

}

@keyframes pulse{

  0%,100%{
    opacity:1;
  }

  50%{
    opacity:.35;
  }

}



/* ============================================================
   STREAMER GRID
   PC = 3명
============================================================ */

.streamer-grid{

  display:grid;

  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:14px;

}



/* ============================================================
   CARD
============================================================ */

.card{

  min-width:0;

  background:var(--bg-elev);

  border:1px solid var(--pitch-line);

  border-radius:var(--card-radius);

  padding:14px;

  display:flex;

  align-items:flex-start;

  gap:12px;

  position:relative;

  overflow:hidden;

  transition:
    border-color .15s,
    transform .15s,
    background .15s;

}

.card:hover{

  border-color:#30463b;

  background:#141e1a;

  transform:translateY(-2px);

}

.card.live{

  border-color:rgba(255,92,92,.5);

}

.card.live::before{

  content:"";

  position:absolute;

  left:0;

  right:0;

  top:0;

  height:3px;

  background:#ff5c5c;

}



/* ============================================================
   SOOP TIER
============================================================ */

.card-soop-tier{

  position:absolute;

  top:10px;

  right:10px;

  z-index:2;

  border:1px solid rgba(155,255,92,.25);

  background:rgba(155,255,92,.08);

  color:var(--turf);

  border-radius:7px;

  padding:4px 7px;

  font-family:var(--font-body);

  font-size:11px;

  font-weight:800;

  white-space:nowrap;

  cursor:pointer;

}



/* ============================================================
   AVATAR
============================================================ */

.streamer-link{

  display:block;

  color:inherit;

  text-decoration:none;

  border-radius:12px;

  outline:none;

  flex-shrink:0;

}

.avatar{

  width:72px;

  height:72px;

  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      var(--pitch-line),
      #1c2822
    );

  display:flex;

  align-items:center;

  justify-content:center;

  font-family:var(--font-display);

  font-size:22px;

  font-weight:900;

  color:var(--turf-dim);

  overflow:hidden;

  border:1px solid transparent;

  transition:.15s;

}

.avatar img{

  width:100%;

  height:100%;

  object-fit:cover;

}

.streamer-link:hover .avatar{

  border-color:rgba(155,255,92,.45);

  transform:translateY(-1px);

}



/* ============================================================
   META
============================================================ */

.meta{

  min-width:0;

  flex:1;

  padding-right:45px;

  text-align:left;

}

.name-row{

  display:flex;

  align-items:center;

  justify-content:flex-start;

  gap:7px;

  flex-wrap:nowrap;

  min-width:0;

}

.name{

  font-weight:900;

  font-size:17px;

  transition:color .15s;

  white-space:nowrap;

}

.streamer-link:hover .name{

  color:var(--turf);

}

.live-badge{

  flex-shrink:0;

  font-family:var(--font-mono);

  font-size:10px;

  background:#ff5c5c;

  color:#1a0a0a;

  padding:3px 7px;

  border-radius:5px;

  font-weight:800;

}



/* ============================================================
   SOOP ID
   @SOOPID
   FC 닉네임 위
============================================================ */

.soop-id{

  margin-top:4px;

  color:var(--text-dim);

  font-family:var(--font-mono);

  font-size:11px;

  line-height:1.25;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}



/* ============================================================
   FC NICKNAME
============================================================ */

.fc-nickname{

  margin-top:4px;

  display:flex;

  align-items:center;

  justify-content:flex-start;

  gap:5px;

  color:var(--text);

  font-size:14px;

  line-height:1.3;

  font-weight:800;

  letter-spacing:-.015em;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}

.fc-ball{

  font-size:13px;

  line-height:1;

  flex-shrink:0;

}



/* ============================================================
   BOTTOM INFO
   크루 → DIVISION → NOTE
============================================================ */

.card-info-row{

  margin-top:9px;

  display:flex;

  align-items:center;

  justify-content:flex-start;

  gap:5px;

  width:100%;

  min-width:0;

  white-space:nowrap;

  overflow:hidden;

}

.info-item{

  display:inline-flex;

  align-items:center;

  min-width:0;

  max-width:100%;

  flex-shrink:0;

  border:0;

  background:transparent;

  color:var(--text-dim);

  padding:0;

  margin:0;

  font-family:var(--font-body);

  font-size:11px;

  font-weight:700;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}

.info-item.clickable{

  cursor:pointer;

  color:var(--turf);

}

.info-item.clickable:hover{

  text-decoration:underline;

}

.info-separator{

  color:#52645b;

  font-size:10px;

  flex-shrink:0;

}

.info-division{

  color:var(--turf);

}

.info-note{

  color:var(--text-dim);

  min-width:0;

  flex:1;

}



/* ============================================================
   OLD BADGES - FILTER ONLY
============================================================ */

.tier-wrap{

  margin-top:7px;

}

.badge-row{

  display:flex;

  align-items:center;

  justify-content:flex-start;

  gap:5px;

  flex-wrap:wrap;

}

.filter-badge{

  border:1px solid rgba(155,255,92,.25);

  background:rgba(155,255,92,.08);

  color:var(--turf);

  cursor:pointer;

  font-family:var(--font-body);

  font-size:10px;

  font-weight:800;

  letter-spacing:.01em;

  padding:5px 8px;

  border-radius:7px;

  white-space:nowrap;

  transition:.12s;

}

.filter-badge:hover{

  filter:brightness(1.15);

  border-color:rgba(155,255,92,.45);

  transform:translateY(-1px);

}



/* ============================================================
   EMPTY
============================================================ */

.empty{

  grid-column:1/-1;

  text-align:center;

  padding:50px 20px;

  color:var(--text-dim);

  font-size:14px;

}

.empty strong{

  display:block;

  color:var(--text);

  margin-bottom:5px;

}



/* ============================================================
   FOOTER
============================================================ */

footer{

  max-width:1000px;

  margin:28px auto 0;

  padding:0 20px;

  font-family:var(--font-mono);

  font-size:11px;

  color:var(--text-dim);

  line-height:1.6;

}

footer code{

  background:var(--bg-elev);

  padding:1px 5px;

  border-radius:4px;

}



/* ============================================================
   TABLET
============================================================ */

@media(max-width:850px){

  .streamer-grid{

    grid-template-columns:
      repeat(2,minmax(0,1fr));

  }

}



/* ============================================================
   MOBILE
============================================================ */

@media(max-width:620px){

  header{

    padding:18px 12px 14px;

  }

  .hero{

    padding:22px 16px;

  }

  .filter-panel{

    padding-left:12px;

    padding-right:12px;

  }

  main{

    padding-left:12px;

    padding-right:12px;

  }

  .streamer-grid{

    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:9px;

  }

  .card{

    padding:11px 8px;

    gap:8px;

  }

  .avatar{

    width:58px;

    height:58px;

    border-radius:10px;

  }

  .meta{

    padding-right:36px;

  }

  .name{

    font-size:14px;

  }

  .soop-id{

    font-size:9px;

  }

  .fc-nickname{

    font-size:12px;

  }

  .card-info-row{

    gap:4px;

  }

  .info-item{

    font-size:9px;

  }

  .card-soop-tier{

    top:8px;

    right:8px;

    font-size:9px;

    padding:3px 5px;

  }

}



/* ============================================================
   SMALL MOBILE
============================================================ */

@media(max-width:390px){

  .streamer-grid{

    grid-template-columns:1fr;

  }

  .card{

    padding:14px 12px;

  }

  .avatar{

    width:64px;

    height:64px;

  }

  .name{

    font-size:16px;

  }

  .soop-id{

    font-size:10px;

  }

  .fc-nickname{

    font-size:13px;

  }

  .info-item{

    font-size:10px;

  }

}

</style>
</head>



<body>



<!-- ============================================================
     HEADER
============================================================ -->

<header>

  <div class="hero">

    <div class="hero-content">

      <p class="eyebrow">
        SOOP · FC ONLINE
      </p>

      <h1>
        스트리머 티어보드
      </h1>

      <p class="sub">
        FC온라인 카테고리 스트리머 실력 랭킹
      </p>

    </div>

  </div>



  <div class="controls">

    <input
      type="text"
      id="search"
      placeholder="스트리머 이름 · FC닉네임 · SOOP ID 검색"
    >



    <select id="soopSort">

      <option value="default">
        SOOP TIER순
      </option>

      <option value="soop-asc">
        SOOP TIER 높은순
      </option>

      <option value="soop-desc">
        SOOP TIER 낮은순
      </option>

    </select>



    <select id="fcSort">

      <option value="default">
        FC ONLINE 티어순
      </option>

      <option value="fc-asc">
        FC ONLINE 높은순
      </option>

      <option value="fc-desc">
        FC ONLINE 낮은순
      </option>

    </select>



    <select id="sortSel">

      <option value="tier">
        기본 정렬
      </option>

      <option value="name">
        이름순
      </option>

      <option value="live">
        방송중 우선
      </option>

    </select>

  </div>

</header>



<!-- ============================================================
     FILTERS
============================================================ -->

<div class="filter-panel">

  <div
    class="filter-row"
    id="soopFilters"
  ></div>



  <div
    class="filter-row"
    id="fcFilters"
    style="margin-top:7px;"
  ></div>



  <div
    class="filter-row"
    id="crewFilters"
    style="margin-top:7px;"
  ></div>



  <div
    class="active-filters"
    id="activeFilters"
  ></div>

</div>



<!-- ============================================================
     MAIN
============================================================ -->

<main>

  <div class="live-strip">

    <span class="dot"></span>

    <span id="liveCount">
      0명 방송 중
    </span>

  </div>



  <div
    class="streamer-grid"
    id="grid"
  ></div>

</main>



<footer>

  데이터는
  <code>data/streamers.json</code>
  에서 관리합니다.

  <br>

  방송 상태는 60초마다 자동 확인하며,

  FC온라인 공식경기 1on1 티어는
  5분마다 자동 조회합니다.

</footer>



<script>

/* ============================================================
   DATA
============================================================ */

let STREAMERS = [];

let DIVISION_META = {};

const LIVE_REFRESH_MS = 60000;

const TIER_REFRESH_MS = 300000;



/* ============================================================
   NEXON DIVISION META
============================================================ */

const DIVISION_META_URL =
  'https://open.api.nexon.com/static/fconline/meta/division.json';



/* ============================================================
   FILTER STATE
============================================================ */

const FILTERS = {

  soopTier:null,

  fcTier:null,

  crew:null

};



/* ============================================================
   ELEMENTS
============================================================ */

const grid =
  document.getElementById('grid');

const search =
  document.getElementById('search');

const sortSel =
  document.getElementById('sortSel');

const soopSort =
  document.getElementById('soopSort');

const fcSort =
  document.getElementById('fcSort');

const liveCount =
  document.getElementById('liveCount');

const soopFilters =
  document.getElementById('soopFilters');

const fcFilters =
  document.getElementById('fcFilters');

const crewFilters =
  document.getElementById('crewFilters');

const activeFilters =
  document.getElementById('activeFilters');



/* ============================================================
   ESCAPE
============================================================ */

function escapeHtml(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}



/* ============================================================
   NORMALIZE SOOP TIER
============================================================ */

function normalizeSoopTier(value){

  const text =
    String(value || '').trim();

  if(
    !text ||
    text === '?티어' ||
    text === '100티어'
  ){

    return '티어없음';

  }

  return text;

}



/* ============================================================
   DIVISION NAME CONVERTER
============================================================ */

function getDivisionName(divisionId){

  if(
    divisionId === null ||
    divisionId === undefined ||
    divisionId === ''
  ){

    return null;

  }

  const id =
    Number(divisionId);

  if(!Number.isFinite(id)){

    return null;

  }



  /*
    Nexon meta가 다음과 같은 형태일 경우
    [
      {
        "divisionId": 900,
        "divisionName": "..."
      }
    ]
  */

  if(Array.isArray(DIVISION_META)){

    const found =
      DIVISION_META.find(
        item =>
          Number(
            item.divisionId
          ) === id
      );

    if(found){

      return (
        found.divisionName ||
        found.name ||
        null
      );

    }

  }



  /*
    혹시 object 형태로 들어오는 경우
  */

  if(
    DIVISION_META &&
    typeof DIVISION_META === 'object'
  ){

    const direct =
      DIVISION_META[id];

    if(direct){

      if(typeof direct === 'string'){

        return direct;

      }

      return (
        direct.divisionName ||
        direct.name ||
        null
      );

    }

  }



  return null;

}



/* ============================================================
   LOAD DIVISION META
============================================================ */

async function loadDivisionMeta(){

  try{

    const res =
      await fetch(
        DIVISION_META_URL,
        {
          cache:'no-store'
        }
      );

    if(!res.ok){

      throw new Error(
        `division meta fetch failed: ${res.status}`
      );

    }

    DIVISION_META =
      await res.json();

    console.log(
      'Division Meta 로드 완료:',
      DIVISION_META
    );

  }catch(err){

    console.warn(
      'Division Meta 로드 실패:',
      err
    );

    DIVISION_META = {};

  }

}



/* ============================================================
   APPLY DIVISION NAME
============================================================ */

function applyDivisionNames(){

  STREAMERS.forEach(s => {

    /*
      이미 API에서 divisionName을 받은 경우 우선 사용
    */

    if(
      s.divisionName &&
      s.divisionName !== 'null' &&
      s.divisionName !== 'undefined'
    ){

      s.tier =
        s.divisionName;

      return;

    }



    /*
      divisionId → Nexon Meta 변환
    */

    const converted =
      getDivisionName(
        s.divisionId
      );

    if(converted){

      s.divisionName =
        converted;

      s.tier =
        converted;

    }

  });

}



/* ============================================================
   LOAD STREAMERS
============================================================ */

async function loadStreamers(){

  const res =
    await fetch(
      '/data/streamers.json',
      {
        cache:'no-store'
      }
    );

  if(!res.ok){

    throw new Error(
      `streamers.json fetch failed: ${res.status}`
    );

  }

  const data =
    await res.json();

  if(!Array.isArray(data)){

    throw new Error(
      'streamers.json must be an array'
    );

  }

  STREAMERS =
    data

      .filter(
        s => s.active !== false
      )

      .map(s => {

        const divisionId =
          s.divisionId ?? null;

        return {

          id:
            s.id || '',

          name:
            s.name ||
            s.id ||
            '',

          fcNickname:
            s.fcNickname ||
            '',

          tier:
            s.tier ||
            null,

          divisionId:
            divisionId,

          divisionName:
            s.divisionName ||
            null,

          soopTier:
            normalizeSoopTier(
              s.soopTier
            ),

          crew:
            s.crew ||
            null,

          note:
            s.note ||
            '',

          /*
            나중에 streamers.json에
            avatarUrl을 넣으면 사용 가능
          */

          avatarUrl:
            s.avatarUrl ||
            s.thumbnail ||
            s.image ||
            '',

          live:false

        };

      });



  applyDivisionNames();

}



/* ============================================================
   LIVE STATUS
============================================================ */

async function refreshLiveStatus(){

  if(!STREAMERS.length){

    render();

    return;

  }

  const ids =
    STREAMERS

      .map(
        s => s.id
      )

      .filter(Boolean)

      .join(',');

  try{

    const res =
      await fetch(
        `/api/live-status?ids=${encodeURIComponent(ids)}`
      );

    if(!res.ok){

      throw new Error(
        'status fetch failed'
      );

    }

    const data =
      await res.json();

    STREAMERS.forEach(s => {

      if(data[s.id]){

        s.live =
          !!data[s.id].live;

      }

    });

  }catch(err){

    console.warn(
      '실시간 상태 갱신 실패:',
      err
    );

  }

  render();

}



/* ============================================================
   TIER STATUS
============================================================ */

async function refreshTierStatus(){

  const nicknames =
    STREAMERS

      .map(
        s => s.fcNickname
      )

      .filter(Boolean)

      .join(',');

  if(!nicknames){

    render();

    return;

  }

  try{

    const res =
      await fetch(
        `/api/tier?nicknames=${encodeURIComponent(nicknames)}`
      );

    if(!res.ok){

      throw new Error(
        'tier fetch failed'
      );

    }

    const data =
      await res.json();



    STREAMERS.forEach(s => {

      if(!s.fcNickname){

        return;

      }

      const info =
        data[s.fcNickname];

      if(!info){

        return;

      }



      /*
        FC 닉네임 변경
      */

      if(info.currentNickname){

        s.fcNickname =
          info.currentNickname;

      }



      /*
        divisionId 저장
      */

      if(info.divisionId != null){

        s.divisionId =
          Number(info.divisionId);

      }



      /*
        API에서 divisionName을 주면 사용
      */

      if(
        info.divisionName &&
        info.divisionName !== 'null' &&
        info.divisionName !== 'undefined'
      ){

        s.divisionName =
          info.divisionName;

        s.tier =
          info.divisionName;

      }

    });



    /*
      API가 divisionName을 안 줘도
      divisionId → Nexon Meta로 다시 변환
    */

    applyDivisionNames();



  }catch(err){

    console.warn(
      '티어 갱신 실패:',
      err
    );

  }

  buildFilterButtons();

  render();

}



/* ============================================================
   DIVISION RANK
============================================================ */

function divisionRank(s){

  return s.divisionId == null
    ? Infinity
    : Number(s.divisionId);

}



/* ============================================================
   SOOP RANK
============================================================ */

function soopRank(s){

  const value =
    String(
      normalizeSoopTier(
        s.soopTier
      )
    );

  const match =
    value.match(/\d+/);

  if(!match){

    return Infinity;

  }

  return Number(match[0]);

}



/* ============================================================
   TIER CLASS
============================================================ */

function tierClass(divisionId){

  if(divisionId == null)
    return 'tier-unranked';

  if(divisionId <= 1300)
    return 'tier-top';

  if(divisionId <= 1900)
    return 'tier-high';

  if(divisionId <= 2200)
    return 'tier-mid';

  if(divisionId <= 2500)
    return 'tier-low';

  return 'tier-basic';

}



/* ============================================================
   UNIQUE VALUES
============================================================ */

function uniqueValues(key){

  return [

    ...new Set(

      STREAMERS

        .map(
          s => {

            if(key === 'soopTier'){

              return normalizeSoopTier(
                s.soopTier
              );

            }

            return s[key];

          }
        )

        .filter(
          value =>
            value != null &&
            String(value).trim() !== ''
        )

    )

  ];

}



/* ============================================================
   FILTER BUTTONS
============================================================ */

function buildFilterButtons(){

  if(
    !soopFilters ||
    !fcFilters ||
    !crewFilters
  ){

    return;

  }



  /* SOOP */

  const soopValues =
    uniqueValues('soopTier')
      .sort(
        (a,b) =>
          soopRank({
            soopTier:a
          })
          -
          soopRank({
            soopTier:b
          })
      );



  soopFilters.innerHTML = `

    <button
      class="filter-btn ${FILTERS.soopTier === null ? 'active' : ''}"
      data-filter-type="soopTier"
      data-filter-value=""
    >
      SOOP 전체
    </button>

    ${
      soopValues
        .map(
          value => `

            <button
              class="filter-btn ${FILTERS.soopTier === value ? 'active' : ''}"
              data-filter-type="soopTier"
              data-filter-value="${escapeHtml(value)}"
            >
              ${escapeHtml(value)}
            </button>

          `
        )
        .join('')
    }

  `;



  /* FC */

  const fcValues =
    uniqueValues('tier')
      .sort(
        (a,b) => {

          const sa =
            STREAMERS.find(
              s => s.tier === a
            );

          const sb =
            STREAMERS.find(
              s => s.tier === b
            );

          return (
            divisionRank(sa || {}) -
            divisionRank(sb || {})
          );

        }
      );



  fcFilters.innerHTML = `

    <button
      class="filter-btn ${FILTERS.fcTier === null ? 'active' : ''}"
      data-filter-type="fcTier"
      data-filter-value=""
    >
      FC 전체
    </button>

    ${
      fcValues
        .map(
          value => `

            <button
              class="filter-btn ${FILTERS.fcTier === value ? 'active' : ''}"
              data-filter-type="fcTier"
              data-filter-value="${escapeHtml(value)}"
            >
              ${escapeHtml(value)}
            </button>

          `
        )
        .join('')
    }

  `;



  /* CREW */

  const crewValues =
    uniqueValues('crew')
      .sort(
        (a,b) =>
          String(a)
            .localeCompare(
              String(b),
              'ko'
            )
      );



  crewFilters.innerHTML = `

    <button
      class="filter-btn ${FILTERS.crew === null ? 'active' : ''}"
      data-filter-type="crew"
      data-filter-value=""
    >
      CREW 전체
    </button>

    ${
      crewValues
        .map(
          value => `

            <button
              class="filter-btn ${FILTERS.crew === value ? 'active' : ''}"
              data-filter-type="crew"
              data-filter-value="${escapeHtml(value)}"
            >
              ${escapeHtml(value)}
            </button>

          `
        )
        .join('')
    }

  `;



  bindFilterButtons();

}



/* ============================================================
   FILTER EVENTS
============================================================ */

function bindFilterButtons(){

  document
    .querySelectorAll(
      '.filter-btn'
    )
    .forEach(button => {

      button.addEventListener(
        'click',
        () => {

          const type =
            button.dataset.filterType;

          const value =
            button.dataset.filterValue;

          if(type === 'soopTier'){

            FILTERS.soopTier =
              value || null;

          }

          if(type === 'fcTier'){

            FILTERS.fcTier =
              value || null;

          }

          if(type === 'crew'){

            FILTERS.crew =
              value || null;

          }

          buildFilterButtons();

          render();

        }
      );

    });

}



/* ============================================================
   ACTIVE FILTERS
============================================================ */

function renderActiveFilters(){

  if(!activeFilters){

    return;

  }

  const filters = [];



  if(FILTERS.soopTier){

    filters.push({
      type:'soopTier',
      label:`SOOP ${FILTERS.soopTier}`
    });

  }



  if(FILTERS.fcTier){

    filters.push({
      type:'fcTier',
      label:`FC ${FILTERS.fcTier}`
    });

  }



  if(FILTERS.crew){

    filters.push({
      type:'crew',
      label:`CREW ${FILTERS.crew}`
    });

  }



  if(!filters.length){

    activeFilters.classList.remove(
      'has-filter'
    );

    activeFilters.innerHTML = '';

    return;

  }



  activeFilters.classList.add(
    'has-filter'
  );



  activeFilters.innerHTML = `

    <span class="filter-label">
      FILTER
    </span>

    ${
      filters
        .map(
          filter => `

            <button
              class="active-chip"
              data-active-type="${filter.type}"
            >
              ${escapeHtml(filter.label)}
              <span>×</span>
            </button>

          `
        )
        .join('')
    }

    <button
      class="clear-filters"
      id="clearFilters"
    >
      초기화
    </button>

  `;



  activeFilters
    .querySelectorAll('.active-chip')
    .forEach(button => {

      button.addEventListener(
        'click',
        () => {

          FILTERS[
            button.dataset.activeType
          ] = null;

          buildFilterButtons();

          render();

        }
      );

    });



  const clear =
    document.getElementById(
      'clearFilters'
    );

  if(clear){

    clear.addEventListener(
      'click',
      clearAllFilters
    );

  }

}



/* ============================================================
   CLEAR FILTERS
============================================================ */

function clearAllFilters(){

  FILTERS.soopTier = null;

  FILTERS.fcTier = null;

  FILTERS.crew = null;

  buildFilterButtons();

  render();

}



/* ============================================================
   APPLY FILTERS
============================================================ */

function applyFilters(list){

  return list.filter(s => {

    if(
      FILTERS.soopTier &&
      normalizeSoopTier(
        s.soopTier
      ) !== FILTERS.soopTier
    ){

      return false;

    }



    if(
      FILTERS.fcTier &&
      s.tier !== FILTERS.fcTier
    ){

      return false;

    }



    if(
      FILTERS.crew &&
      s.crew !== FILTERS.crew
    ){

      return false;

    }



    return true;

  });

}



/* ============================================================
   SORT
============================================================ */

function sortList(list){

  const mode =
    sortSel.value;

  const soopMode =
    soopSort.value;

  const fcMode =
    fcSort.value;



  /* 이름순 */

  if(mode === 'name'){

    list.sort(
      (a,b) =>
        String(a.name || '')
          .localeCompare(
            String(b.name || ''),
            'ko'
          )
    );

    return;

  }



  /* 방송중 우선 */

  if(mode === 'live'){

    list.sort(
      (a,b) =>
        (Number(b.live) - Number(a.live)) ||
        (divisionRank(a) - divisionRank(b))
    );

    return;

  }



  /* SOOP */

  if(soopMode === 'soop-asc'){

    list.sort(
      (a,b) =>
        soopRank(a) - soopRank(b)
    );

    return;

  }



  if(soopMode === 'soop-desc'){

    list.sort(
      (a,b) =>
        soopRank(b) - soopRank(a)
    );

    return;

  }



  /* FC */

  if(fcMode === 'fc-asc'){

    list.sort(
      (a,b) =>
        divisionRank(a) -
        divisionRank(b)
    );

    return;

  }



  if(fcMode === 'fc-desc'){

    list.sort(
      (a,b) =>
        divisionRank(b) -
        divisionRank(a)
    );

    return;

  }



  /* 기본 */

  list.sort(
    (a,b) =>
      (Number(b.live) - Number(a.live)) ||
      (divisionRank(a) - divisionRank(b))
  );

}



/* ============================================================
   RENDER
============================================================ */

function render(){

  if(
    !grid ||
    !search ||
    !sortSel ||
    !liveCount
  ){

    return;

  }



  /*
    혹시 divisionName이 새로 들어왔거나
    divisionId가 갱신된 경우 다시 변환
  */

  applyDivisionNames();



  const q =
    search.value
      .trim()
      .toLowerCase();



  let list =
    STREAMERS.filter(s => {

      const name =
        String(
          s.name || ''
        ).toLowerCase();

      const id =
        String(
          s.id || ''
        ).toLowerCase();

      const fcNickname =
        String(
          s.fcNickname || ''
        ).toLowerCase();

      const note =
        String(
          s.note || ''
        ).toLowerCase();

      return (
        name.includes(q) ||
        id.includes(q) ||
        fcNickname.includes(q) ||
        note.includes(q)
      );

    });



  list =
    applyFilters(list);



  sortList(list);



  renderActiveFilters();



  liveCount.textContent =
    STREAMERS.filter(
      s => s.live
    ).length +
    '명 방송 중 · 60초마다 자동 갱신';



  if(!list.length){

    grid.innerHTML = `

      <div class="empty">

        <strong>
          조건에 맞는 스트리머가 없습니다.
        </strong>

        검색어나 필터를 확인해주세요.

      </div>

    `;

    return;

  }



  grid.innerHTML =
    list
      .map(
        renderCard
      )
      .join('');



  bindCardFilterButtons();

}



/* ============================================================
   CARD
============================================================ */

function renderCard(s){

  const normalizedSoopTier =
    normalizeSoopTier(
      s.soopTier
    );



  /*
    중요:
    division 숫자를 화면에 직접 표시하지 않음.
    반드시 divisionName을 먼저 사용.
  */

  let divisionName =
    s.divisionName ||
    getDivisionName(
      s.divisionId
    );



  /*
    divisionName도 없을 경우
    기존 tier가 실제 이름이면 사용.
    그래도 없으면 '티어 확인 중'
  */

  if(
    !divisionName &&
    s.tier &&
    !String(s.tier).match(/^등급\s*\d+$/)
  ){

    divisionName =
      s.tier;

  }



  if(!divisionName){

    divisionName =
      '티어 확인 중';

  }



  const firstLetter =
    String(
      s.name || '?'
    ).slice(0,1);



  const soopTier =
    escapeHtml(
      normalizedSoopTier
    );



  const crew =
    escapeHtml(
      s.crew
    );



  const note =
    escapeHtml(
      s.note
    );



  const id =
    escapeHtml(
      s.id
    );



  const name =
    escapeHtml(
      s.name
    );



  const safeDivision =
    escapeHtml(
      divisionName
    );



  const fcNickname =
    escapeHtml(
      s.fcNickname
    );



  /*
    썸네지:
    JSON에 avatarUrl이 있으면 사용.
    없으면 기존 첫 글자.
  */

  const avatarHtml =
    s.avatarUrl

      ? `

        <img
          src="${escapeHtml(s.avatarUrl)}"
          alt="${name}"
          loading="lazy"
          onerror="this.style.display='none'; this.parentElement.classList.add('avatar-fallback');"
        >

        <span class="avatar-letter">
          ${firstLetter}
        </span>

      `

      : `

        <span class="avatar-letter">
          ${firstLetter}
        </span>

      `;



  return `

    <article
      class="card ${s.live ? 'live' : ''}"
    >



      <!-- SOOP TIER -->

      <button
        type="button"
        class="card-soop-tier"
        data-filter-type="soopTier"
        data-filter-value="${soopTier}"
        title="이 SOOP 티어만 보기"
      >
        ${soopTier}
      </button>



      <!-- 방송국 -->

      <a
        class="streamer-link"
        href="https://ch.sooplive.co.kr/${encodeURIComponent(s.id)}"
        target="_blank"
        rel="noopener"
        aria-label="${name} 방송국 열기"
      >

        <div class="avatar">

          ${avatarHtml}

        </div>

      </a>



      <!-- 스트리머 정보 -->

      <div class="meta">



        <!-- 이름 -->

        <div class="name-row">

          <a
            class="streamer-link"
            href="https://ch.sooplive.co.kr/${encodeURIComponent(s.id)}"
            target="_blank"
            rel="noopener"
          >

            <span class="name">
              ${name}
            </span>

          </a>



          ${
            s.live
              ? `

                <span class="live-badge">
                  LIVE
                </span>

              `
              : ''
          }

        </div>



        <!-- SOOP ID -->

        <div
          class="soop-id"
          title="SOOP ID"
        >

          @${id}

        </div>



        <!-- FC 닉네임 -->

        ${
          s.fcNickname
            ? `

              <div
                class="fc-nickname"
                title="FC온라인 닉네임"
              >

                <span class="fc-ball">
                  ⚽
                </span>

                <span>
                  ${fcNickname}
                </span>

              </div>

            `
            : ''
        }



        <!-- ==================================================
             하단 정보
             크루 → Division → Note
        =================================================== -->

        <div class="card-info-row">



          ${
            s.crew
              ? `

                <button
                  type="button"
                  class="info-item clickable"
                  data-filter-type="crew"
                  data-filter-value="${crew}"
                  title="이 크루만 보기"
                >
                  ${crew}
                </button>

                <span class="info-separator">
                  ·
                </span>

              `
              : ''
          }



          <!-- DIVISION -->

          <button
            type="button"
            class="info-item info-division clickable"
            data-filter-type="fcTier"
            data-filter-value="${safeDivision}"
            title="이 FC온라인 티어만 보기"
          >

            ${safeDivision}

          </button>



          ${
            s.note
              ? `

                <span class="info-separator">
                  ·
                </span>

                <span
                  class="info-item info-note"
                  title="${note}"
                >
                  ${note}
                </span>

              `
              : ''
          }



        </div>



      </div>



    </article>

  `;

}



/* ============================================================
   CARD FILTER BUTTONS
============================================================ */

function bindCardFilterButtons(){

  document
    .querySelectorAll(
      '.card .filter-badge, .card .card-soop-tier, .card .info-item.clickable'
    )
    .forEach(button => {

      button.addEventListener(
        'click',
        event => {

          event.preventDefault();

          event.stopPropagation();



          const type =
            button.dataset.filterType;

          const value =
            button.dataset.filterValue;



          if(type === 'soopTier'){

            FILTERS.soopTier =
              FILTERS.soopTier === value
                ? null
                : value;

          }



          if(type === 'fcTier'){

            FILTERS.fcTier =
              FILTERS.fcTier === value
                ? null
                : value;

          }



          if(type === 'crew'){

            FILTERS.crew =
              FILTERS.crew === value
                ? null
                : value;

          }



          buildFilterButtons();

          render();

        }
      );

    });

}



/* ============================================================
   SEARCH
============================================================ */

search.addEventListener(
  'input',
  render
);



/* ============================================================
   SORT
============================================================ */

sortSel.addEventListener(
  'change',
  render
);

soopSort.addEventListener(
  'change',
  render
);

fcSort.addEventListener(
  'change',
  render
);



/* ============================================================
   INITIALIZE
============================================================ */

async function init(){

  try{

    /*
      1.
      스트리머 데이터 로드
    */

    await loadStreamers();



    /*
      2.
      Nexon Division 이름 메타 로드

      divisionId 900
      ↓
      실제 Division 이름
    */

    await loadDivisionMeta();



    /*
      3.
      divisionId → divisionName
    */

    applyDivisionNames();



    /*
      4.
      필터 / 최초 화면
    */

    buildFilterButtons();

    render();



    /*
      5.
      실시간 방송 상태
    */

    await refreshLiveStatus();



    /*
      6.
      FC온라인 티어
    */

    await refreshTierStatus();



    /*
      7.
      60초마다 방송 상태
    */

    setInterval(
      refreshLiveStatus,
      LIVE_REFRESH_MS
    );



    /*
      8.
      5분마다 FC 티어
    */

    setInterval(
      refreshTierStatus,
      TIER_REFRESH_MS
    );



  }catch(err){

    console.error(
      '초기화 실패:',
      err
    );



    if(grid){

      grid.innerHTML = `

        <div class="empty">

          <strong>
            스트리머 데이터를 불러오지 못했습니다.
          </strong>

          <small>
            ${escapeHtml(err.message)}
          </small>

        </div>

      `;

    }

  }

}



init();

</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC온라인 스트리머 티어보드</title>
<style>
  :root{
    --bg: #0c1210;
    --bg-elev: #121a17;
    --pitch-line: #22332c;
    --turf: #9bff5c;
    --turf-dim: #6fbf3f;
    --text: #eef5ee;
    --text-dim: #93a89c;
    --plat: #7fe8d4;
    --gold: #f0c34c;
    --silver: #c7d0cd;
    --bronze: #c98b4e;
    --unranked: #5c6b64;
    --card-radius: 14px;
    --font-display: 'Archivo Black', 'Pretendard', system-ui, sans-serif;
    --font-body: 'Pretendard', -apple-system, 'Noto Sans KR', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'Roboto Mono', monospace;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:
      radial-gradient(circle at 15% -10%, rgba(155,255,92,0.10), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    padding-bottom:60px;
  }

  header{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--pitch-line);
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(12,18,16,0.92);
    backdrop-filter:blur(6px);
  }

  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--turf);
    text-transform:uppercase;
    margin:0 0 6px;
  }

  h1{
    font-family:var(--font-display);
    font-size:clamp(22px,6vw,34px);
    letter-spacing:-0.01em;
    margin:0 0 4px;
    line-height:1.05;
  }

  .sub{
    color:var(--text-dim);
    font-size:13px;
    margin:0;
  }

  .controls{
    display:flex;
    gap:8px;
    margin-top:16px;
    flex-wrap:wrap;
  }

  .controls input[type=text]{
    flex:1;
    min-width:160px;
    background:var(--bg-elev);
    border:1px solid var(--pitch-line);
    color:var(--text);
    padding:10px 12px;
    border-radius:10px;
    font-family:var(--font-body);
    font-size:14px;
  }

  select{
    background:var(--bg-elev);
    border:1px solid var(--pitch-line);
    color:var(--text);
    padding:10px 12px;
    border-radius:10px;
    font-size:13px;
    font-family:var(--font-body);
  }

  main{
    max-width:760px;
    margin:0 auto;
    padding:18px 16px 0;
  }

  .live-strip{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    margin:14px 2px 18px;
    letter-spacing:0.04em;
  }

  .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ff5c5c;
    box-shadow:0 0 8px #ff5c5c;
    animation:pulse 1.6s infinite;
  }

  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.35;}
  }

  .grid{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .card{
    background:var(--bg-elev);
    border:1px solid var(--pitch-line);
    border-radius:var(--card-radius);
    padding:14px 14px;
    display:grid;
    grid-template-columns:44px 1fr auto;
    gap:12px;
    align-items:center;
    text-decoration:none;
    color:inherit;
    transition:border-color .15s, transform .15s;
    position:relative;
    overflow:hidden;
  }

  .card:active{
    transform:scale(0.99);
  }

  .card.live{
    border-color:rgba(255,92,92,0.5);
  }

  .card.live::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:3px;
    background:#ff5c5c;
  }

  .avatar{
    width:44px;
    height:44px;
    border-radius:10px;
    background:linear-gradient(135deg,var(--pitch-line),#1c2822);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:var(--font-display);
    font-size:15px;
    color:var(--turf-dim);
    overflow:hidden;
    flex-shrink:0;
  }

  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .meta{
    min-width:0;
  }

  .name-row{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }

  .name{
    font-weight:700;
    font-size:15px;
  }

  .live-badge{
    font-family:var(--font-mono);
    font-size:9px;
    letter-spacing:0.06em;
    background:#ff5c5c;
    color:#1a0a0a;
    padding:2px 6px;
    border-radius:5px;
    font-weight:700;
    flex-shrink:0;
  }

  .id-line{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--text-dim);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .tier-wrap{
    text-align:right;
    flex-shrink:0;
  }

  .tier-badge{
    font-family:var(--font-display);
    font-size:11px;
    letter-spacing:0.03em;
    padding:5px 10px;
    border-radius:8px;
    display:inline-block;
    white-space:nowrap;
  }

  .tier-top{
    background:rgba(127,232,212,0.14);
    color:var(--plat);
    border:1px solid rgba(127,232,212,0.35);
  }

  .tier-high{
    background:rgba(140,170,255,0.14);
    color:#a9bcff;
    border:1px solid rgba(140,170,255,0.35);
  }

  .tier-mid{
    background:rgba(240,195,76,0.15);
    color:var(--gold);
    border:1px solid rgba(240,195,76,0.4);
  }

  .tier-low{
    background:rgba(199,208,205,0.12);
    color:var(--silver);
    border:1px solid rgba(199,208,205,0.3);
  }

  .tier-basic{
    background:rgba(201,139,78,0.15);
    color:var(--bronze);
    border:1px solid rgba(201,139,78,0.4);
  }

  .tier-unranked{
    background:rgba(92,107,100,0.15);
    color:var(--unranked);
    border:1px solid rgba(92,107,100,0.3);
  }

  .score{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--text-dim);
    margin-top:4px;
  }

  footer{
    max-width:760px;
    margin:28px auto 0;
    padding:0 16px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-dim);
    line-height:1.6;
  }

  footer code{
    background:var(--bg-elev);
    padding:1px 5px;
    border-radius:4px;
  }

  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--text-dim);
    font-size:13px;
  }
.badge-row{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:5px;
  flex-wrap:wrap;
}

.info-badge{
  background:rgba(155,255,92,0.10);
  color:var(--turf);
  border:1px solid rgba(155,255,92,0.30);
  font-family:var(--font-display);
  font-size:11px;
  letter-spacing:0.03em;
  padding:5px 10px;
  border-radius:8px;
  display:inline-block;
  white-space:nowrap;
}
</style>
</head>

<body>

<header>
  <p class="eyebrow">SOOP · FC ONLINE</p>
  <h1>스트리머 티어보드</h1>
  <p class="sub">FC온라인 카테고리 스트리머 실력 랭킹</p>

  <div class="controls">
    <input
      type="text"
      id="search"
      placeholder="스트리머 이름 검색"
    >

    <select id="sortSel">
      <option value="tier">티어순</option>
      <option value="name">이름순</option>
      <option value="live">방송중 우선</option>
    </select>
  </div>
</header>

<main>
  <div class="live-strip">
    <span class="dot"></span>
    <span id="liveCount">0명 방송 중</span>
  </div>

  <div class="grid" id="grid"></div>
</main>

<footer>
  데이터는 <code>data/streamers.json</code>에서 관리합니다.<br>
  방송 상태는 60초마다 자동 확인하며,
  FC온라인 공식경기 1on1 티어는 5분마다 자동 조회합니다.
</footer>

<script>

/* ============================================================
   스트리머 데이터
   실제 등록 정보는 data/streamers.json에서 관리
============================================================ */

let STREAMERS = [];

const LIVE_REFRESH_MS = 60000;
const TIER_REFRESH_MS = 300000;


/* ============================================================
   HTML 요소
============================================================ */

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const sortSel = document.getElementById('sortSel');
const liveCount = document.getElementById('liveCount');


/* ============================================================
   streamers.json 불러오기
============================================================ */

async function loadStreamers(){

  const res = await fetch('/data/streamers.json', {
    cache: 'no-store'
  });

  if(!res.ok){
    throw new Error(
      `streamers.json fetch failed: ${res.status}`
    );
  }

  const data = await res.json();

  if(!Array.isArray(data)){
    throw new Error(
      'streamers.json must be an array'
    );
  }

  STREAMERS = data.map(s => {

  const divisionId =
    s.divisionId ?? null;

  return {
    id: s.id || '',
    name: s.name || s.id || '',
    fcNickname: s.fcNickname || '',

    /*
     * 저장된 tier가 있으면 사용
     * 없고 divisionId가 있으면 임시로 표시
     */
    tier:
      s.tier ||
      (
        divisionId != null
          ? `등급 ${divisionId}`
          : null
      ),

    divisionId,

    soopTier: s.soopTier || null,
    crew: s.crew || null,
    note: s.note || '',
    live: false
  };

  });

}
/* ============================================================
   SOOP 방송 상태
============================================================ */

async function refreshLiveStatus(){

  if(!STREAMERS.length){
    render();
    return;
  }

  const ids = STREAMERS
    .map(s => s.id)
    .filter(Boolean)
    .join(',');

  try{

    const res = await fetch(
      `/api/live-status?ids=${encodeURIComponent(ids)}`
    );

    if(!res.ok){
      throw new Error('status fetch failed');
    }

    const data = await res.json();

    STREAMERS.forEach(s => {

      if(data[s.id]){
        s.live = !!data[s.id].live;
      }

    });

  }catch(err){

    console.warn(
      '실시간 상태 갱신 실패, 이전 상태 유지:',
      err
    );

  }

  render();
}


/* ============================================================
   FC온라인 공식경기 1on1 티어
============================================================ */

async function refreshTierStatus(){

  const nicknames = STREAMERS
    .map(s => s.fcNickname)
    .filter(Boolean)
    .join(',');

  if(!nicknames){
    render();
    return;
  }

  try{

    const res = await fetch(
      `/api/tier?nicknames=${encodeURIComponent(nicknames)}`
    );

    if(!res.ok){
      throw new Error('tier fetch failed');
    }

    const data = await res.json();

    STREAMERS.forEach(s => {

      if(!s.fcNickname){
        return;
      }

      const info = data[s.fcNickname];

      if(info){

        /*
         * 현재 FC온라인 닉네임
         */
        if(info.currentNickname){
          s.fcNickname = info.currentNickname;
        }


        /*
         * ----------------------------------------------------
         * divisionId
         *
         * API 값이 있으면 API 값
         * 없으면 streamers.json에 저장된 기존 값 유지
         * ----------------------------------------------------
         */
        if(info.divisionId != null){

          s.divisionId =
            Number(info.divisionId);

        }


        /*
         * ----------------------------------------------------
         * tier
         *
         * 1순위 : API의 divisionName
         * 2순위 : 기존 streamers.json의 tier
         * 3순위 : divisionId를 이용한 임시 표시
         * ----------------------------------------------------
         */
        if(
          info.divisionName &&
          info.divisionName !== 'null'
        ){

          s.tier =
            info.divisionName;

        }else if(
          !s.tier &&
          s.divisionId != null
        ){

          /*
           * API가 divisionName을 주지 않는 경우에도
           * tier가 null로 남지 않도록 합니다.
           *
           * 현재 API의 divisionName을 받지 못한 경우
           * divisionId 자체를 표시합니다.
           */
          s.tier =
            `등급 ${s.divisionId}`;

        }

      }

    });


  }catch(err){

    console.warn(
      '티어 갱신 실패, 기존 데이터 유지:',
      err
    );


    /*
     * API 자체가 실패하더라도
     * streamers.json의 divisionId가 있으면
     * tier를 만들어줍니다.
     */
    STREAMERS.forEach(s => {

      if(
        !s.tier &&
        s.divisionId != null
      ){

        s.tier =
          `등급 ${s.divisionId}`;

      }

    });

  }


  render();
}

/* ============================================================
   티어 정렬
============================================================ */

function divisionRank(s){

  return s.divisionId == null
    ? Infinity
    : s.divisionId;

}


function tierClass(divisionId){

  if(divisionId == null)
    return 'tier-unranked';

  if(divisionId <= 1300)
    return 'tier-top';

  if(divisionId <= 1900)
    return 'tier-high';

  if(divisionId <= 2200)
    return 'tier-mid';

  if(divisionId <= 2500)
    return 'tier-low';

  return 'tier-basic';

}


/* ============================================================
   화면 렌더링
============================================================ */

function render(){

  if(!grid || !search || !sortSel || !liveCount){
    console.error(
      '화면 요소를 찾지 못했습니다.',
      {
        grid,
        search,
        sortSel,
        liveCount
      }
    );

    return;
  }

  const q = search.value
    .trim()
    .toLowerCase();

  let list = STREAMERS.filter(s => {

    const name = String(s.name || '').toLowerCase();
    const id = String(s.id || '').toLowerCase();
    const fcNickname = String(s.fcNickname || '').toLowerCase();

    return (
      name.includes(q) ||
      id.includes(q) ||
      fcNickname.includes(q)
    );

  });


  const mode = sortSel.value;


if(mode === 'tier'){

  list.sort(
    (a,b) =>
      (b.live - a.live) ||
      (divisionRank(a) - divisionRank(b))
  );

}else if(mode === 'name'){

    list.sort(
      (a,b) =>
        a.name.localeCompare(b.name, 'ko')
    );

  }else if(mode === 'live'){

    list.sort(
      (a,b) =>
        (b.live - a.live) ||
        (divisionRank(a) - divisionRank(b))
    );

  }else{

    // 기본 정렬
    // 1. 방송 중
    // 2. 방송 중인 사람끼리는 FC온라인 티어순
    // 3. 방송 종료
    // 4. 방송 종료한 사람끼리도 FC온라인 티어순

    list.sort(
      (a,b) =>
        (b.live - a.live) ||
        (divisionRank(a) - divisionRank(b))
    );

  }


  liveCount.textContent =
    STREAMERS.filter(s => s.live).length +
    '명 방송 중 (60초마다 자동 갱신)';


  if(list.length === 0){

    grid.innerHTML =
      '<div class="empty">검색 결과가 없습니다</div>';

    return;

  }


  grid.innerHTML = list.map(s => {

    const tierLabel =
      s.tier || '불러오는 중…';

    const firstLetter =
      String(s.name || '?').slice(0,1);


    return `
      <a
        class="card ${s.live ? 'live' : ''}"
        href="https://ch.sooplive.co.kr/${encodeURIComponent(s.id)}"
        target="_blank"
        rel="noopener"
      >

        <div class="avatar">
          ${firstLetter}
        </div>

        <div class="meta">

          <div class="name-row">

            <span class="name">
              ${s.name}
            </span>

            ${
              s.live
                ? '<span class="live-badge">LIVE</span>'
                : ''
            }

          </div>

          <div class="id-line">
  @${s.id}${s.fcNickname ? ` · ${s.fcNickname}` : ''}${s.note ? ` · ${s.note}` : ''}
</div>
        </div>

        <div class="tier-wrap">

  <div class="badge-row">

    <span
      class="tier-badge ${tierClass(s.divisionId)}"
    >
      ${tierLabel}
    </span>

    ${
      s.soopTier
        ? `
          <span class="info-badge">
            ${s.soopTier}
          </span>
        `
        : ''
    }

    ${
      s.crew
        ? `
          <span class="info-badge">
            ${s.crew}
          </span>
        `
        : ''
    }

  </div>

</div>
      </a>
    `;

  }).join('');

}


/* ============================================================
   검색 / 정렬
============================================================ */

search.addEventListener(
  'input',
  render
);

sortSel.addEventListener(
  'change',
  render
);


/* ============================================================
   초기 실행
============================================================ */

async function init(){

  try{

    await loadStreamers();

    render();

    await refreshLiveStatus();

    await refreshTierStatus();

    setInterval(
      refreshLiveStatus,
      LIVE_REFRESH_MS
    );

    setInterval(
      refreshTierStatus,
      TIER_REFRESH_MS
    );

  }catch(err){

    console.error(
      '초기화 실패:',
      err
    );

    if(grid){

      grid.innerHTML =
        `
        <div class="empty">
          스트리머 데이터를 불러오지 못했습니다.<br>
          <small>${err.message}</small>
        </div>
        `;

    }

  }

}

init();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC온라인 스트리머 티어보드</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0c1210;
  --bg-elev:#121a17;
  --bg-elev-2:#17211d;
  --pitch-line:#22332c;
  --turf:#9bff5c;
  --turf-dim:#6fbf3f;
  --text:#eef5ee;
  --text-dim:#93a89c;
  --unranked:#5c6b64;
  --card-radius:14px;
  --font-display:'Noto Sans KR',system-ui,sans-serif;
  --font-body:'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Noto Sans KR',monospace;
}

*{
  box-sizing:border-box;
}

html{
  -webkit-text-size-adjust:100%;
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at 15% -10%,
      rgba(155,255,92,.10),
      transparent 45%
    ),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  padding-bottom:60px;
}

button,
input,
select{
  font-family:inherit;
}

header{
  padding:28px 20px 20px;
  border-bottom:1px solid var(--pitch-line);
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(12,18,16,.95);
  backdrop-filter:blur(10px);
}

.hero{
  position:relative;
  max-width:1000px;
  margin:0 auto;
  padding:28px 24px 24px;
  overflow:hidden;
  border-radius:16px;
  background:
    linear-gradient(
      90deg,
      rgba(12,18,16,.97),
      rgba(12,18,16,.82),
      rgba(12,18,16,.94)
    ),
    url('/assets/fconline-bg.jpg')
    center/cover no-repeat;
  border:1px solid rgba(155,255,92,.12);
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      135deg,
      rgba(155,255,92,.08),
      transparent 45%
    );
}

.hero-content{
  position:relative;
  z-index:1;
}

.eyebrow{
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:.18em;
  color:var(--turf);
  text-transform:uppercase;
  margin:0 0 6px;
}

h1{
  font-family:var(--font-display);
  font-size:clamp(24px,6vw,36px);
  letter-spacing:-.03em;
  margin:0 0 5px;
  line-height:1.1;
  font-weight:900;
}

.sub{
  color:var(--text-dim);
  font-size:14px;
  margin:0;
}

/* ============================================================
   NAV
============================================================ */

.page-nav{
  max-width:1000px;
  margin:12px auto 0;
  display:flex;
  gap:7px;
}

.page-nav button{
  border:1px solid var(--pitch-line);
  background:var(--bg-elev);
  color:var(--text-dim);
  border-radius:9px;
  padding:9px 14px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}

.page-nav button:hover{
  border-color:rgba(155,255,92,.35);
  color:var(--text);
}

.page-nav button.active{
  background:rgba(155,255,92,.10);
  border-color:rgba(155,255,92,.45);
  color:var(--turf);
}

/* ============================================================
   PAGE
============================================================ */

.page{
  display:none;
}

.page.active{
  display:block;
}

/* ============================================================
   CONTROLS
============================================================ */

.controls{
  display:flex;
  gap:8px;
  margin:14px auto 0;
  max-width:1000px;
  flex-wrap:wrap;
  justify-content:flex-start;
}

.controls input[type=text]{
  flex:1;
  min-width:180px;
  background:var(--bg-elev);
  border:1px solid var(--pitch-line);
  color:var(--text);
  padding:11px 13px;
  border-radius:10px;
  font-size:14px;
  outline:none;
}

.controls input[type=text]:focus{
  border-color:rgba(155,255,92,.45);
}

select{
  background:var(--bg-elev);
  border:1px solid var(--pitch-line);
  color:var(--text);
  padding:11px 13px;
  border-radius:10px;
  font-size:14px;
  outline:none;
  cursor:pointer;
}

/* ============================================================
   FILTER PANEL
============================================================ */

.filter-panel{
  max-width:1000px;
  margin:0 auto;
  padding:14px 20px 0;
  text-align:left;
}

.filter-row{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:3px;
}

.filter-row::-webkit-scrollbar{
  display:none;
}

.filter-btn{
  flex-shrink:0;
  border:1px solid var(--pitch-line);
  background:var(--bg-elev);
  color:var(--text-dim);
  border-radius:9px;
  padding:8px 12px;
  font-size:12px;
  cursor:pointer;
  transition:.15s;
}

.filter-btn:hover{
  border-color:rgba(155,255,92,.35);
  color:var(--text);
}

.filter-btn.active{
  background:rgba(155,255,92,.10);
  border-color:rgba(155,255,92,.45);
  color:var(--turf);
  font-weight:700;
}

.active-filters{
  display:none;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  margin-top:10px;
}

.active-filters.has-filter{
  display:flex;
}

.filter-label{
  font-size:11px;
  color:var(--text-dim);
  font-family:var(--font-mono);
}

.active-chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border-radius:7px;
  padding:5px 8px;
  border:1px solid rgba(155,255,92,.25);
  background:rgba(155,255,92,.07);
  color:var(--turf);
  font-size:11px;
  cursor:pointer;
}

.clear-filters{
  border:0;
  background:transparent;
  color:var(--text-dim);
  font-size:11px;
  cursor:pointer;
}

/* ============================================================
   MAIN
============================================================ */

main{
  max-width:1000px;
  margin:0 auto;
  padding:18px 20px 0;
}

.live-strip{
  display:flex;
  align-items:center;
  gap:8px;
  font-family:var(--font-mono);
  font-size:12px;
  color:var(--text-dim);
  margin:8px 2px 16px;
  letter-spacing:.04em;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ff5c5c;
  box-shadow:0 0 8px #ff5c5c;
  animation:pulse 1.6s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1;}
  50%{opacity:.35;}
}

/* ============================================================
   STREAMER GRID
============================================================ */

.streamer-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}

/* ============================================================
   CARD
============================================================ */

.card{
  min-width:0;
  background:var(--bg-elev);
  border:1px solid var(--pitch-line);
  border-radius:var(--card-radius);
  padding:14px;
  display:flex;
  align-items:flex-start;
  gap:12px;
  position:relative;
  overflow:hidden;
  transition:
    border-color .15s,
    transform .15s,
    background .15s;
}

.card:hover{
  border-color:#30463b;
  background:#141e1a;
  transform:translateY(-2px);
}

.card.live{
  border-color:rgba(255,92,92,.5);
}

.card.live::before{
  content:"";
  position:absolute;
  left:0;
  right:0;

  height:3px;
  background:#ff5c5c;
}

.card-soop-tier{
  position:absolute;
  top:10px;

  color:var(--turf);

  padding:4px 7px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
  cursor:pointer;
}

.streamer-link{
  display:block;
  color:inherit;

  border-radius:12px;
  outline:none;
  flex-shrink:0;
}

.avatar{
  width:72px;

  border-radius:12px;
  background:
    linear-gradient(
      135deg,
      var(--pitch-line),
      #1c2822
    );
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:900;
  color:var(--turf-dim);
  overflow:hidden;
  border:1px solid transparent;
  transition:.15s;
  position:relative;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.avatar-letter{
  position:absolute;
}

.streamer-link:hover .avatar{
  border-color:rgba(155,255,92,.45);
  transform:translateY(-1px);
}

.meta{
  min-width:0;
  flex:1;
  padding-right:45px;
}

.name-row{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:7px;
  flex-wrap:nowrap;
  min-width:0;
}

.name{
  font-weight:900;
  font-size:17px;
  transition:color .15s;
  white-space:nowrap;
}

.streamer-link:hover .name{
  color:var(--turf);
}

.live-badge{
  flex-shrink:0;
  font-family:var(--font-mono);
  font-size:10px;
  background:#ff5c5c;
  color:#1a0a0a;
  padding:3px 7px;
  border-radius:5px;
  font-weight:800;
}

.soop-id{
  margin-top:4px;
  color:var(--text-dim);
  font-family:var(--font-mono);
  font-size:11px;
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.fc-nickname{
  margin-top:4px;
  display:flex;
  align-items:center;
  gap:5px;
  color:var(--text);
  font-size:14px;
  line-height:1.3;
  font-weight:800;
  letter-spacing:-.015em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.fc-ball{
  font-size:13px;
  line-height:1;
  flex-shrink:0;
}

.card-info-row{
  margin-top:9px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:5px;
  width:100%;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
}

.info-item{
  display:inline-flex;
  align-items:center;
  min-width:0;
  max-width:100%;
  flex-shrink:0;
  border:0;
  background:transparent;
  color:var(--text-dim);
  padding:0;
  margin:0;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.info-item.clickable{
  cursor:pointer;
  color:var(--turf);
}

.info-item.clickable:hover{
  text-decoration:underline;
}

.info-separator{
  color:#52645b;
  font-size:10px;
  flex-shrink:0;
}

.info-division{
  color:var(--turf);
}

.info-note{
  color:var(--text-dim);
  min-width:0;
  flex:1;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:50px 20px;
  color:var(--text-dim);
  font-size:14px;
}

.empty strong{
  display:block;
  color:var(--text);
  margin-bottom:5px;
}

footer{
  max-width:1000px;
  margin:28px auto 0;
  padding:0 20px;
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--text-dim);
  line-height:1.6;
}

footer code{
  background:var(--bg-elev);
  padding:1px 5px;
  border-radius:4px;
}

/* ============================================================
   MATCH PAGE
============================================================ */

.match-page{
  max-width:1000px;
  margin:0 auto;
  padding:18px 20px 0;
}

.match-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:8px 0 16px;
}

.match-title-wrap h2{
  margin:0;
  font-size:22px;
  font-weight:900;
}

.match-title-wrap p{
  margin:4px 0 0;
  color:var(--text-dim);
  font-size:12px;
}

.match-refresh{
  border:1px solid var(--pitch-line);
  background:var(--bg-elev);
  color:var(--text-dim);
  border-radius:9px;
  padding:9px 12px;
  font-size:12px;
  cursor:pointer;
}

.match-refresh:hover{
  color:var(--turf);
  border-color:rgba(155,255,92,.35);
}

.match-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.match-card{
  background:var(--bg-elev);
  border:1px solid var(--pitch-line);
  border-radius:14px;
  padding:16px;
  transition:.15s;
}

.match-card:hover{
  border-color:#30463b;
  background:#141e1a;
  transform:translateY(-1px);
}

.match-date{
  color:var(--text-dim);
  font-family:var(--font-mono);
  font-size:10px;
  margin-bottom:12px;
}

.match-versus{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
}

.match-player{
  min-width:0;
}

.match-player.right{
  text-align:right;
}

.match-player-name{
  font-size:16px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.match-player-fc{
  margin-top:3px;
  color:var(--text-dim);
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.match-score{
  min-width:90px;
  text-align:center;
}

.match-score-number{
  font-family:var(--font-mono);
  font-size:25px;
  font-weight:900;
  letter-spacing:.04em;
}

.match-result{
  margin-top:4px;
  color:var(--text-dim);
  font-size:10px;
}

.match-result.win{
  color:var(--turf);
}

.match-result.draw{
  color:#e7d875;
}

.match-empty{
  text-align:center;
  padding:60px 20px;
  background:var(--bg-elev);
  border:1px solid var(--pitch-line);
  border-radius:14px;
  color:var(--text-dim);
}

.match-empty strong{
  display:block;
  color:var(--text);
  margin-bottom:6px;
}

.match-loading{
  text-align:center;
  padding:60px 20px;
  color:var(--text-dim);
}

/* ============================================================
   TABLET
============================================================ */

@media(max-width:850px){
  .streamer-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

/* ============================================================
   MOBILE
============================================================ */

@media(max-width:620px){

  header{
    padding:18px 12px 14px;
  }

  .hero{
    padding:22px 16px;
  }

  .page-nav{
    margin-top:10px;
  }

  .page-nav button{
    flex:1;
  }

  .filter-panel{
    padding-left:12px;
    padding-right:12px;
  }

  main,
  .match-page{
    padding-left:12px;
    padding-right:12px;
  }

  .streamer-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
  }

  .card{
    padding:11px 8px;
    gap:8px;
  }

  .avatar{
    width:58px;
    height:58px;
    border-radius:10px;
  }

  .meta{
    padding-right:36px;
  }

  .name{
    font-size:14px;
  }

  .soop-id{
    font-size:9px;
  }

  .fc-nickname{
    font-size:12px;
  }

  .card-info-row{
    gap:4px;
  }

  .info-item{
    font-size:9px;
  }

  .card-soop-tier{
    top:8px;
    right:8px;
    font-size:9px;
    padding:3px 5px;
  }

  .match-header{
    align-items:flex-start;
  }

  .match-title-wrap h2{
    font-size:19px;
  }

  .match-versus{
    gap:7px;
  }

  .match-player-name{
    font-size:13px;
  }

  .match-player-fc{
    font-size:9px;
  }

  .match-score{
    min-width:60px;
  }

  .match-score-number{
    font-size:21px;
  }
}

/* ============================================================
   SMALL MOBILE
============================================================ */

@media(max-width:390px){

  .streamer-grid{
    grid-template-columns:1fr;
  }

  .card{
    padding:14px 12px;
  }

  .avatar{
    width:64px;
    height:64px;
  }

  .name{
    font-size:16px;
  }

  .soop-id{
    font-size:10px;
  }

  .fc-nickname{
    font-size:13px;
  }

  .info-item{
    font-size:10px;
  }
}
</style>
</head>

<body>

<header>

  <div class="hero">
    <div class="hero-content">
      <p class="eyebrow">SOOP · FC ONLINE</p>

      <h1>스트리머 티어보드</h1>

      <p class="sub">FC온라인 카테고리 스트리머 실력 랭킹</p>
    </div>
  </div>

  <nav class="page-nav">
    <button
      type="button"
      id="tierPageBtn"
      class="active"
    >
      티어보드
    </button>

    <button
      type="button"
      id="matchPageBtn"
    >
      스트리머 매치
    </button>
  </nav>

  <div
    class="controls"
    id="tierControls"
  >
    <input
      type="text"
      id="search"
      placeholder="스트리머 이름 · FC닉네임 · SOOP ID 검색"
    >

    <select id="soopSort">
      <option value="default">SOOP TIER순</option>
      <option value="soop-asc">SOOP TIER 높은순</option>
      <option value="soop-desc">SOOP TIER 낮은순</option>
    </select>

    <select id="fcSort">
      <option value="default">FC ONLINE 티어순</option>
      <option value="fc-asc">FC ONLINE 높은순</option>
      <option value="fc-desc">FC ONLINE 낮은순</option>
    </select>

    <select id="sortSel">
      <option value="tier">기본 정렬</option>
      <option value="name">이름순</option>
      <option value="live">방송중 우선</option>
    </select>
  </div>

</header>

<!-- ============================================================
     TIER PAGE
============================================================ -->

<section
  id="tierPage"
  class="page active"
>

  <div
    class="filter-panel"
    id="tierFilterPanel"
  >

    <div
      class="filter-row"
      id="soopFilters"
    ></div>

    <div
      class="filter-row"
      id="fcFilters"
      style="margin-top:7px;"
    ></div>

    <div
      class="filter-row"
      id="crewFilters"
      style="margin-top:7px;"
    ></div>

    <div
      class="active-filters"
      id="activeFilters"
    ></div>

  </div>

  <main>

    <div class="live-strip">
      <span class="dot"></span>

      <span id="liveCount">
        0명 방송 중
      </span>
    </div>

    <div
      class="streamer-grid"
      id="grid"
    ></div>

  </main>

</section>

<!-- ============================================================
     MATCH PAGE
============================================================ -->

<section
  id="matchPage"
  class="page"
>

  <div class="match-page">

    <div class="match-header">

      <div class="match-title-wrap">

        <h2>스트리머 매치</h2>

        <p>
          등록된 스트리머끼리 진행한 FC온라인 친선경기
        </p>

      </div>

      <button
        type="button"
        class="match-refresh"
        id="matchRefresh"
      >
        새로고침
      </button>

    </div>

    <div
      id="matchList"
      class="match-list"
    ></div>

  </div>

</section>

<footer>

  데이터는
  <code>data/streamers.json</code>
  에서 관리합니다.

  <br>

  방송 상태는 60초마다 자동 확인하며,

  FC온라인 공식경기 1on1 티어는
  5분마다 자동 조회합니다.

</footer>

<script>

/* ============================================================
   DATA
============================================================ */

let STREAMERS = [];

let DIVISION_META = {};

const LIVE_REFRESH_MS = 60000;

const TIER_REFRESH_MS = 300000;

const MATCH_REFRESH_MS = 300000;

/* ============================================================
   NEXON
============================================================ */

const DIVISION_META_URL =
  'https://open.api.nexon.com/static/fconline/meta/division.json';

/* ============================================================
   FILTER STATE
============================================================ */

const FILTERS = {
  soopTier:null,
  fcTier:null,
  crew:null
};

/* ============================================================
   ELEMENTS
============================================================ */

const grid =
  document.getElementById('grid');

const search =
  document.getElementById('search');

/* ============================================================
   ESCAPE
============================================================ */

function escapeHtml(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}

/* ============================================================
   SOOP TIER
============================================================ */

function normalizeSoopTier(value){

  const text =
    String(value || '').trim();

  if(
    !text ||
    text === '?티어' ||
    text === '100티어'
  ){
    return '티어없음';
  }

  return text;
}

/* ============================================================
   DIVISION
============================================================ */

function getDivisionName(divisionId){

  if(
    divisionId === null ||
    divisionId === undefined ||
    divisionId === ''
  ){
    return null;
  }

  const id =
    Number(divisionId);

  if(!Number.isFinite(id)){
    return null;
  }

  if(Array.isArray(DIVISION_META)){

    const found =
      DIVISION_META.find(
        item =>
          Number(item.divisionId) === id
      );

    if(found){

      return (
        found.divisionName ||
        found.name ||
        null
      );

    }
  }

  if(
    DIVISION_META &&
    typeof DIVISION_META === 'object'
  ){

    const direct =
      DIVISION_META[id];

    if(direct){

      if(typeof direct === 'string'){
        return direct;
      }

      return (
        direct.divisionName ||
        direct.name ||
        null
      );
    }
  }

  return null;
}

/* ============================================================
   LOAD DIVISION META
============================================================ */

async function loadDivisionMeta(){

  try{

    const res =
      await fetch(
        DIVISION_META_URL,
        {
          cache:'no-store'
        }
      );

    if(!res.ok){
      throw new Error(
        `division meta fetch failed: ${res.status}`
      );
    }

    DIVISION_META =
      await res.json();

  }catch(err){

    console.warn(
      'Division Meta 로드 실패:',
      err
    );

    DIVISION_META = {};
  }
}

/* ============================================================
   APPLY DIVISION
============================================================ */

function applyDivisionNames(){

  STREAMERS.forEach(s => {

    if(
      s.divisionName &&
      s.divisionName !== 'null' &&
      s.divisionName !== 'undefined'
    ){

      s.tier =
        s.divisionName;

      return;
    }

    const converted =
      getDivisionName(
        s.divisionId
      );

    if(converted){

      s.divisionName =
        converted;

      s.tier =
        converted;
    }
  });
}

/* ============================================================
   LOAD STREAMERS
============================================================ */

async function loadStreamers(){

  const res =
    await fetch(
      '/data/streamers.json',
      {
        cache:'no-store'
      }
    );

  if(!res.ok){

    throw new Error(
      `streamers.json fetch failed: ${res.status}`
    );
  }

  const data =
    await res.json();

  if(!Array.isArray(data)){

    throw new Error(
      'streamers.json must be an array'
    );
  }

  STREAMERS =
    data
      .filter(
        s => s.active !== false
      )
      .map(s => {

        const divisionId =
          s.divisionId ?? null;

        return {

          id:
            s.id || '',

          name:
            s.name ||
            s.id ||
            '',

          fcNickname:
            s.fcNickname ||
            '',

          fcOuid:
            s.fcOuid ||
            null,

          tier:
            s.tier ||
            null,

          divisionId,

          divisionName:
            s.divisionName ||
            null,

          soopTier:
            normalizeSoopTier(
              s.soopTier
            ),

          crew:
            s.crew ||
            null,

          note:
            s.note ||
            '',

          avatarUrl:
            s.avatarUrl ||
            s.thumbnail ||
            s.image ||
            '',

          live:false
        };
      });

  applyDivisionNames();
}

/* ============================================================
   LIVE STATUS
============================================================ */

async function refreshLiveStatus(){

  if(!STREAMERS.length){

    render();

    return;
  }

  const ids =
    STREAMERS
      .map(s => s.id)
      .filter(Boolean)
      .join(',');

  try{

    const res =
      await fetch(
        `/api/live-status?ids=${encodeURIComponent(ids)}`,
        {
          cache:'no-store'
        }
      );

    if(!res.ok){
      throw new Error(
        'status fetch failed'
      );
    }

    const data =
      await res.json();

    STREAMERS.forEach(s => {

      if(data[s.id]){

        s.live =
          !!data[s.id].live;
      }
    });

  }catch(err){

    console.warn(
      '실시간 상태 갱신 실패:',
      err
    );
  }

  render();
}

/* ============================================================
   TIER STATUS
============================================================ */

async function refreshTierStatus(){

  const nicknames =
    STREAMERS
      .map(s => s.fcNickname)
      .filter(Boolean)
      .join(',');

  if(!nicknames){

    render();

    return;
  }

  try{

    const res =
      await fetch(
        `/api/tier?nicknames=${encodeURIComponent(nicknames)}`,
        {
          cache:'no-store'
        }
      );

    if(!res.ok){
      throw new Error(
        'tier fetch failed'
      );
    }

    const data =
      await res.json();

    STREAMERS.forEach(s => {

      if(!s.fcNickname){
        return;
      }

      const info =
        data[s.fcNickname];

      if(!info){
        return;
      }

      if(info.currentNickname){

        s.fcNickname =
          info.currentNickname;
      }

      if(info.ouid){

        s.fcOuid =
          info.ouid;
      }

      if(info.divisionId != null){

        s.divisionId =
          Number(info.divisionId);
      }

      if(
        info.divisionName &&
        info.divisionName !== 'null' &&
        info.divisionName !== 'undefined'
      ){

        s.divisionName =
          info.divisionName;

        s.tier =
          info.divisionName;
      }
    });

    applyDivisionNames();

  }catch(err){

    console.warn(
      '티어 갱신 실패:',
      err
    );
  }

  buildFilterButtons();

  render();
}

/* ============================================================
   RANK
============================================================ */

function divisionRank(s){

  return s.divisionId == null
    ? Infinity
    : Number(s.divisionId);
}

function soopRank(s){

  const value =
    String(
      normalizeSoopTier(
        s.soopTier
      )
    );

  const match =
    value.match(/\d+/);

  if(!match){
    return Infinity;
  }

  return Number(match[0]);
}

/* ============================================================
   UNIQUE
============================================================ */

function uniqueValues(key){

  return [
    ...new Set(
      STREAMERS
        .map(s => {

          if(key === 'soopTier'){

            return normalizeSoopTier(
              s.soopTier
            );
          }

          return s[key];
        })
        .filter(
          value =>
            value != null &&
            String(value).trim() !== ''
        )
    )
  ];
}

/* ============================================================
   FILTER BUTTONS
============================================================ */

function buildFilterButtons(){

  if(
    !soopFilters ||
    !fcFilters ||
    !crewFilters
  ){
    return;
  }

  const soopValues =
    uniqueValues('soopTier')
      .sort(
        (a,b) =>
          soopRank({soopTier:a}) -
          soopRank({soopTier:b})
      );

  soopFilters.innerHTML = `

    <button
      class="filter-btn ${FILTERS.soopTier === null ? 'active' : ''}"
      data-filter-type="soopTier"
      data-filter-value=""
    >
      SOOP 전체
    </button>

    ${
      soopValues
        .map(
          value => `

            <button
              class="filter-btn ${FILTERS.soopTier === value ? 'active' : ''}"
              data-filter-type="soopTier"
              data-filter-value="${escapeHtml(value)}"
            >
              ${escapeHtml(value)}
            </button>

          `
        )
        .join('')
    }

  `;

  const fcValues =
    uniqueValues('tier')
      .sort(
        (a,b) => {

          const sa =
            STREAMERS.find(
              s => s.tier === a
            );

          const sb =
            STREAMERS.find(
              s => s.tier === b
            );

          return (
            divisionRank(sa || {}) -
            divisionRank(sb || {})
          );
        }
      );

  fcFilters.innerHTML = `

    <button
      class="filter-btn ${FILTERS.fcTier === null ? 'active' : ''}"
      data-filter-type="fcTier"
      data-filter-value=""
    >
      FC 전체
    </button>

    ${
      fcValues
        .map(
          value => `

            <button
              class="filter-btn ${FILTERS.fcTier === value ? 'active' : ''}"
              data-filter-type="fcTier"
              data-filter-value="${escapeHtml(value)}"
            >
              ${escapeHtml(value)}
            </button>

          `
        )
        .join('')
    }

  `;

  const crewValues =
    uniqueValues('crew')
      .sort(
        (a,b) =>
          String(a).localeCompare(
            String(b),
            'ko'
          )
      );

  crewFilters.innerHTML = `

    <button
      class="filter-btn ${FILTERS.crew === null ? 'active' : ''}"
      data-filter-type="crew"
      data-filter-value=""
    >
      CREW 전체
    </button>

    ${
      crewValues
        .map(
          value => `

            <button
              class="filter-btn ${FILTERS.crew === value ? 'active' : ''}"
              data-filter-type="crew"
              data-filter-value="${escapeHtml(value)}"
            >
              ${escapeHtml(value)}
            </button>

          `
        )
        .join('')
    }

  `;

  bindFilterButtons();
}

/* ============================================================
   FILTER EVENTS
============================================================ */

function bindFilterButtons(){

  document
    .querySelectorAll('.filter-btn')
    .forEach(button => {

      button.addEventListener(
        'click',
        () => {

          const type =
            button.dataset.filterType;

          const value =
            button.dataset.filterValue;

          if(type === 'soopTier'){
            FILTERS.soopTier =
              value || null;
          }

          if(type === 'fcTier'){
            FILTERS.fcTier =
              value || null;
          }

          if(type === 'crew'){
            FILTERS.crew =
              value || null;
          }

          buildFilterButtons();
          render();
        }
      );
    });
}

/* ============================================================
   ACTIVE FILTERS
============================================================ */

function renderActiveFilters(){

  if(!activeFilters){
    return;
  }

  const filters = [];

  if(FILTERS.soopTier){

    filters.push({
      type:'soopTier',
      label:`SOOP ${FILTERS.soopTier}`
    });
  }

  if(FILTERS.fcTier){

    filters.push({
      type:'fcTier',
      label:`FC ${FILTERS.fcTier}`
    });
  }

  if(FILTERS.crew){

    filters.push({
      type:'crew',
      label:`CREW ${FILTERS.crew}`
    });
  }

  if(!filters.length){

    activeFilters.classList.remove(
      'has-filter'
    );

    activeFilters.innerHTML = '';

    return;
  }

  activeFilters.classList.add(
    'has-filter'
  );

  activeFilters.innerHTML = `

    <span class="filter-label">
      FILTER
    </span>

    ${
      filters
        .map(
          filter => `

            <button
              class="active-chip"
              data-active-type="${filter.type}"
            >
              ${escapeHtml(filter.label)}
              <span>×</span>
            </button>

          `
        )
        .join('')
    }

    <button
      class="clear-filters"
      id="clearFilters"
    >
      초기화
    </button>

  `;

  activeFilters
    .querySelectorAll('.active-chip')
    .forEach(button => {

      button.addEventListener(
        'click',
        () => {

          FILTERS[
            button.dataset.activeType
          ] = null;

          buildFilterButtons();
          render();
        }
      );
    });

  const clear =
    document.getElementById(
      'clearFilters'
    );

  if(clear){
    clear.addEventListener(
      'click',
      clearAllFilters
    );
  }
}

function clearAllFilters(){

  FILTERS.soopTier = null;
  FILTERS.fcTier = null;
  FILTERS.crew = null;

  buildFilterButtons();
  render();
}

/* ============================================================
   APPLY FILTERS
============================================================ */

function applyFilters(list){

  return list.filter(s => {

    if(
      FILTERS.soopTier &&
      normalizeSoopTier(s.soopTier) !==
      FILTERS.soopTier
    ){
      return false;
    }

    if(
      FILTERS.fcTier &&
      s.tier !== FILTERS.fcTier
    ){
      return false;
    }

    if(
      FILTERS.crew &&
      s.crew !== FILTERS.crew
    ){
      return false;
    }

    return true;
  });
}

/* ============================================================
   SORT
============================================================ */

function sortList(list){

  const mode =
    sortSel.value;

  const soopMode =
    soopSort.value;

  const fcMode =
    fcSort.value;

  if(mode === 'name'){

    list.sort(
      (a,b) =>
        String(a.name || '').localeCompare(
          String(b.name || ''),
          'ko'
        )
    );

    return;
  }

  if(mode === 'live'){

    list.sort(
      (a,b) =>
        Number(b.live) - Number(a.live) ||
        divisionRank(a) - divisionRank(b)
    );

    return;
  }

  if(soopMode === 'soop-asc'){

    list.sort(
      (a,b) =>
        soopRank(a) - soopRank(b)
    );

    return;
  }

  if(soopMode === 'soop-desc'){

    list.sort(
      (a,b) =>
        soopRank(b) - soopRank(a)
    );

    return;
  }

  if(fcMode === 'fc-asc'){

    list.sort(
      (a,b) =>
        divisionRank(a) -
        divisionRank(b)
    );

    return;
  }

  if(fcMode === 'fc-desc'){

    list.sort(
      (a,b) =>
        divisionRank(b) -
        divisionRank(a)
    );

    return;
  }

  list.sort(
    (a,b) =>
      Number(b.live) - Number(a.live) ||
      divisionRank(a) - divisionRank(b)
  );
}

/* ============================================================
   RENDER
============================================================ */

function render(){

  if(
    !grid ||
    !search ||
    !sortSel ||
    !liveCount
  ){
    return;
  }

  applyDivisionNames();

  const q =
    search.value
      .trim()
      .toLowerCase();

  let list =
    STREAMERS.filter(s => {

      const name =
        String(s.name || '').toLowerCase();

      const id =
        String(s.id || '').toLowerCase();

      const fcNickname =
        String(s.fcNickname || '').toLowerCase();

      const note =
        String(s.note || '').toLowerCase();

      return (
        name.includes(q) ||
        id.includes(q) ||
        fcNickname.includes(q) ||
        note.includes(q)
      );
    });

  list =
    applyFilters(list);

  sortList(list);

  renderActiveFilters();

  liveCount.textContent =
    STREAMERS.filter(
      s => s.live
    ).length +
    '명 방송 중 · 60초마다 자동 갱신';

  if(!list.length){

    grid.innerHTML = `

      <div class="empty">

        <strong>
          조건에 맞는 스트리머가 없습니다.
        </strong>

        검색어나 필터를 확인해주세요.

      </div>

    `;

    return;
  }

  grid.innerHTML =
    list
      .map(renderCard)
      .join('');

  bindCardFilterButtons();
}

/* ============================================================

============================================================ */

    );

    s.divisionName ||
    getDivisionName(
      s.divisionId
    );

    !divisionName &&
    s.tier &&
    !String(s.tier).match(/^등급\s*\d+$/)
  ){
    divisionName =
      s.tier;
  }

  if(!divisionName){
    divisionName =
      '티어 확인 중';
  }

  const firstLetter =
    String(
      s.name || '?'
    ).slice(0,1);

  const soopTier =
    escapeHtml(

    );

    escapeHtml(
      s.crew
    );

    escapeHtml(
      s.note
    );

    escapeHtml(
      s.id
    );

    escapeHtml(
      s.name

    >

        ${soopTier}
      </button>

        class="streamer-link"
        href="https://ch.sooplive.co.kr/${encodeURIComponent(s.id)}"
        target="_blank"
        rel="noopener"
        aria-label="${name} 방송국 열기"
      >

        <div class="avatar">
          ${avatarHtml}
        </div>

      </a>

      <div class="meta">

        <div class="name-row">

          <a
            class="streamer-link"
            href="https://ch.sooplive.co.kr/${encodeURIComponent(s.id)}"
            target="_blank"
            rel="noopener"
          >

            <span class="name">
              ${name}
            </span>

          </a>

          ${
            s.live
              ? `
                <span class="live-badge">
                  LIVE
                </span>
              `
              : ''
          }

        </div>

        <div
          class="soop-id"
          title="SOOP ID"
        >
          @${id}
        </div>

        ${
          s.fcNickname
            ? `

              <div
                class="fc-nickname"
                title="FC온라인 닉네임"
              >

                <span class="fc-ball">
                  ⚽
                </span>

                <span>
                  ${fcNickname}
                </span>

              </div>

            `
            : ''
        }

        <div class="card-info-row">

          ${
            s.crew
              ? `

                <button
                  type="button"
                  class="info-item clickable"
                  data-filter-type="crew"
                  data-filter-value="${crew}"
                  title="이 크루만 보기"
                >
                  ${crew}
                </button>

                <span class="info-separator">

/* ============================================================
   CARD FILTER
============================================================ */

function bindCardFilterButtons(){

  document
    .querySelectorAll(
      '.card .card-soop-tier, .card .info-item.clickable'
    )
    .forEach(button => {

      button.addEventListener(
        'click',
        event => {

          event.preventDefault();
          event.stopPropagation();

          const type =
            button.dataset.filterType;

          const value =
            button.dataset.filterValue;

          if(type === 'soopTier'){

            FILTERS.soopTier =
              FILTERS.soopTier === value
                ? null
                : value;
          }

          if(type === 'fcTier'){

            FILTERS.fcTier =
              FILTERS.fcTier === value
                ? null
                : value;
          }

          if(type === 'crew'){

            FILTERS.crew =
              FILTERS.crew === value
                ? null
                : value;
          }

          buildFilterButtons();
          render();
        }
      );
    });
}

/* ============================================================
   MATCH PAGE
============================================================ */

function formatMatchDate(value){

  if(!value){
    return '경기 시간 확인 불가';
  }

  const date =
    new Date(value);

  if(Number.isNaN(date.getTime())){
    return String(value);
  }

  return date.toLocaleString(
    'ko-KR',
    {
      year:'numeric',
      month:'2-digit',
      day:'2-digit',
      hour:'2-digit',
      minute:'2-digit'
    }
  );
}

function renderMatchResult(match){

  if(
    match.result === 'draw'
  ){
    return '무승부';
  }

  return '스트리머 매치';
}

function renderMatchCard(match){

  const p1 =
    match.player1 || {};

  const p2 =
    match.player2 || {};

  const score1 =
    Number.isFinite(Number(p1.score))
      ? Number(p1.score)
      : 0;

  const score2 =
    Number.isFinite(Number(p2.score))
      ? Number(p2.score)
      : 0;

  let resultClass =
    'draw';

  if(score1 > score2){
    resultClass = 'win';
  }

  if(score1 < score2){
    resultClass = 'lose';
  }

  return `

    <article class="match-card">

      <div class="match-date">
        ${escapeHtml(
          formatMatchDate(match.matchDate)
        )}
      </div>

      <div class="match-versus">

        <div class="match-player">

          <div class="match-player-name">
            ${escapeHtml(
              p1.name || p1.fcNickname || '-'
            )}
          </div>

          <div class="match-player-fc">
            ${escapeHtml(
              p1.fcNickname || ''
            )}
          </div>

        </div>

        <div class="match-score">

          <div class="match-score-number">
            ${score1}
            :
            ${score2}
          </div>

          <div class="match-result ${resultClass}">
            ${renderMatchResult(match)}
          </div>

        </div>

        <div class="match-player right">

          <div class="match-player-name">
            ${escapeHtml(
              p2.name || p2.fcNickname || '-'
            )}
          </div>

          <div class="match-player-fc">
            ${escapeHtml(
              p2.fcNickname || ''
            )}
          </div>

        </div>

      </div>

    </article>

  `;
}

async function loadStreamerMatches(){

  if(!matchList){
    return;
  }

  matchList.innerHTML = `

    <div class="match-loading">
      스트리머 매치 데이터를 불러오는 중입니다...
    </div>

  `;

  try{

    const res =
      await fetch(
        '/api/streamer-matches',
        {
          cache:'no-store'
        }
      );

    const data =
      await res.json();

    if(!res.ok){

      throw new Error(
        data?.error ||
        '스트리머 매치 조회 실패'
      );
    }

    const matches =
      Array.isArray(data.matches)
        ? data.matches
        : [];

    if(!matches.length){

      matchList.innerHTML = `

        <div class="match-empty">

          <strong>
            아직 스트리머끼리 진행한 경기가 없습니다.
          </strong>

          등록된 스트리머끼리 FC온라인 친선경기를 진행하면
          여기에 표시됩니다.

        </div>

      `;

      return;
    }

    matchList.innerHTML =
      matches
        .map(renderMatchCard)
        .join('');

  }catch(error){

    console.error(
      '스트리머 매치 조회 실패:',
      error
    );

    matchList.innerHTML = `

      <div class="match-empty">

        <strong>
          스트리머 매치 데이터를 불러오지 못했습니다.
        </strong>

        <span>
          ${escapeHtml(error.message)}
        </span>

      </div>

    `;
  }
}

function showTierPage(){

  tierPage.classList.add('active');
  matchPage.classList.remove('active');

  tierPageBtn.classList.add('active');
  matchPageBtn.classList.remove('active');

  tierControls.style.display = 'flex';

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
}

async function showMatchPage(){

  tierPage.classList.remove('active');
  matchPage.classList.add('active');

  tierPageBtn.classList.remove('active');
  matchPageBtn.classList.add('active');

  tierControls.style.display = 'none';

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

  await loadStreamerMatches();
}

matchRefresh.addEventListener(

============================================================ */

async function init(){

  try{

    await loadStreamers();

    await loadDivisionMeta();

    applyDivisionNames();

    buildFilterButtons();

    render();

    await refreshLiveStatus();

    await refreshTierStatus();

    setInterval(
      refreshLiveStatus,
      LIVE_REFRESH_MS
    );

    setInterval(
      refreshTierStatus,
      TIER_REFRESH_MS
    );

    setInterval(
      () => {

        if(
          matchPage.classList.contains('active')
        ){
          loadStreamerMatches();
        }

      },
      MATCH_REFRESH_MS
    );

  }catch(err){

    console.error(
      '초기화 실패:',
      err
    );

    if(grid){

      grid.innerHTML = `

        <div class="empty">

          <strong>
            스트리머 데이터를 불러오지 못했습니다.
          </strong>

          <small>
            ${escapeHtml(err.message)}
          </small>

        </div>

      `;
    }
  }
}

init();

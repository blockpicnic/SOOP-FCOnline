<script>
let STREAMERS = [];

const LIVE_REFRESH_MS = 60000;
const TIER_REFRESH_MS = 300000;

async function loadStreamers(){
  const res = await fetch('/data/streamers.json', {
    cache: 'no-store'
  });

  if(!res.ok){
    throw new Error(
      `streamers.json 불러오기 실패: ${res.status}`
    );
  }

  const data = await res.json();

  if(!Array.isArray(data)){
    throw new Error(
      'streamers.json은 배열 형식이어야 합니다.'
    );
  }

  STREAMERS = data.map(s => ({
    ...s,
    live: false
  }));
}

async function refreshLiveStatus(){
  if(STREAMERS.length === 0) return;

  const ids = STREAMERS.map(s => s.id).join(',');

  try{
    const res = await fetch(
      `/api/live-status?ids=${encodeURIComponent(ids)}`
    );

    if(!res.ok) throw new Error('status fetch failed');

    const data = await res.json();

    STREAMERS.forEach(s => {
      if(data[s.id]){
        s.live = !!data[s.id].live;
      } else {
        s.live = false;
      }
    });

  } catch(err){
    console.warn(
      '실시간 상태 갱신 실패, 이전 상태 유지:',
      err
    );
  }

  render();
}

async function refreshTierStatus(){
  const validStreamers =
    STREAMERS.filter(s => s.fcNickname);

  if(validStreamers.length === 0) return;

  const nicknames =
    validStreamers.map(s => s.fcNickname).join(',');

  try{
    const res = await fetch(
      `/api/tier?nicknames=${encodeURIComponent(nicknames)}`
    );

    if(!res.ok) throw new Error('tier fetch failed');

    const data = await res.json();

    validStreamers.forEach(s => {
      const info = data[s.fcNickname];

      if(info && !info.error){
        s.tier = info.divisionName;
        s.divisionId = info.divisionId;
      } else if(info && info.error){
        s.tier = "조회 실패";
        s.divisionId = null;

        console.warn(
          `${s.name}(${s.fcNickname}) 티어 조회 실패:`,
          info.error
        );
      }
    });

  } catch(err){
    console.warn(
      '티어 갱신 실패, 이전 상태 유지:',
      err
    );
  }

  render();
}

function divisionRank(s){
  return s.divisionId == null
    ? Infinity
    : s.divisionId;
}

function tierClass(divisionId){
  if(divisionId == null) return 'tier-unranked';
  if(divisionId <= 1300) return 'tier-top';
  if(divisionId <= 1900) return 'tier-high';
  if(divisionId <= 2200) return 'tier-mid';
  if(divisionId <= 2500) return 'tier-low';

  return 'tier-basic';
}

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const sortSel = document.getElementById('sortSel');
const liveCount = document.getElementById('liveCount');

function render(){
  const q = search
    ? search.value.trim().toLowerCase()
    : '';

  let list = STREAMERS.filter(s =>
    (s.name || '').toLowerCase().includes(q) ||
    (s.id || '').toLowerCase().includes(q)
  );

  const mode = sortSel
    ? sortSel.value
    : 'tier';

  if(mode === "tier"){
    list.sort(
      (a,b) =>
        divisionRank(a) - divisionRank(b)
    );

  } else if(mode === "name"){
    list.sort(
      (a,b) =>
        a.name.localeCompare(b.name, 'ko')
    );

  } else if(mode === "live"){
    list.sort(
      (a,b) =>
        (b.live - a.live) ||
        (divisionRank(a) - divisionRank(b))
    );
  }

  liveCount.textContent =
    STREAMERS.filter(s => s.live).length +
    "명 방송 중 (60초마다 자동 갱신)";

  if(list.length === 0){
    grid.innerHTML =
      '<div class="empty">검색 결과가 없습니다</div>';
    return;
  }

  grid.innerHTML = list.map(s => {

    const tierLabel =
      s.tier || "불러오는 중…";

    const extraInfo = [
      `@${s.id}`,
      `FC ${s.fcNickname || '미등록'}`,
      s.soopTier ? `SOOP ${s.soopTier}` : '',
      s.crew || '',
      s.note || ''
    ].filter(Boolean).join(' · ');

    return `
      <a
        class="card ${s.live ? 'live' : ''}"
        href="https://ch.sooplive.co.kr/${s.id}"
        target="_blank"
        rel="noopener"
      >
        <div class="avatar">
          ${s.name.slice(0,1)}
        </div>

        <div class="meta">
          <div class="name-row">
            <span class="name">
              ${s.name}
            </span>

            ${
              s.live
                ? '<span class="live-badge">LIVE</span>'
                : ''
            }
          </div>

          <div class="id-line">
            ${extraInfo}
          </div>
        </div>

        <div class="tier-wrap">
          <span
            class="tier-badge ${tierClass(s.divisionId)}"
          >
            ${tierLabel}
          </span>
        </div>
      </a>
    `;
  }).join('');
}

if (search) {
  search.addEventListener('input', render);
}

if (sortSel) {
  sortSel.addEventListener('change', render);
}

loadStreamers()
  .then(() => {
    render();

    refreshLiveStatus();
    refreshTierStatus();

    setInterval(refreshLiveStatus, LIVE_REFRESH_MS);
    setInterval(refreshTierStatus, TIER_REFRESH_MS);
  })
  .catch(err => {
    console.error('초기화 실패:', err);

    const grid = document.getElementById('grid');

    if (grid) {
      grid.innerHTML =
        '<div class="empty">스트리머 데이터를 불러오지 못했습니다.</div>';
    }
  });
  
</script>

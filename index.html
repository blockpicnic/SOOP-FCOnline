<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC온라인 스트리머 티어보드</title>
<style>
  :root{
    --bg: #0c1210;
    --bg-elev: #121a17;
    --pitch-line: #22332c;
    --turf: #9bff5c;
    --turf-dim: #6fbf3f;
    --text: #eef5ee;
    --text-dim: #93a89c;
    --plat: #7fe8d4;
    --gold: #f0c34c;
    --silver: #c7d0cd;
    --bronze: #c98b4e;
    --unranked: #5c6b64;
    --card-radius: 14px;
    --font-display: 'Archivo Black', 'Pretendard', system-ui, sans-serif;
    --font-body: 'Pretendard', -apple-system, 'Noto Sans KR', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'Roboto Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% -10%, rgba(155,255,92,0.10), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    padding-bottom:60px;
  }
  header{
    padding:28px 20px 18px;
    border-bottom:1px solid var(--pitch-line);
    position:sticky; top:0; z-index:10;
    background:rgba(12,18,16,0.92);
    backdrop-filter:blur(6px);
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.18em;
    color:var(--turf);
    text-transform:uppercase;
    margin:0 0 6px;
  }
  h1{
    font-family:var(--font-display);
    font-size:clamp(22px,6vw,34px);
    letter-spacing:-0.01em;
    margin:0 0 4px;
    line-height:1.05;
  }
  .sub{
    color:var(--text-dim);
    font-size:13px;
    margin:0;
  }
  .controls{
    display:flex; gap:8px; margin-top:16px; flex-wrap:wrap;
  }
  .controls input[type=text]{
    flex:1; min-width:160px;
    background:var(--bg-elev);
    border:1px solid var(--pitch-line);
    color:var(--text);
    padding:10px 12px;
    border-radius:10px;
    font-family:var(--font-body);
    font-size:14px;
  }
  select{
    background:var(--bg-elev);
    border:1px solid var(--pitch-line);
    color:var(--text);
    padding:10px 12px;
    border-radius:10px;
    font-size:13px;
    font-family:var(--font-body);
  }
  main{max-width:760px; margin:0 auto; padding:18px 16px 0;}
  .live-strip{
    display:flex; align-items:center; gap:8px;
    font-family:var(--font-mono); font-size:11px; color:var(--text-dim);
    margin:14px 2px 18px;
    letter-spacing:0.04em;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#ff5c5c;box-shadow:0 0 8px #ff5c5c; animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .grid{display:flex; flex-direction:column; gap:10px;}
  .card{
    background:var(--bg-elev);
    border:1px solid var(--pitch-line);
    border-radius:var(--card-radius);
    padding:14px 14px;
    display:grid;
    grid-template-columns:44px 1fr auto;
    gap:12px;
    align-items:center;
    text-decoration:none;
    color:inherit;
    transition:border-color .15s, transform .15s;
    position:relative;
    overflow:hidden;
  }
  .card:active{transform:scale(0.99);}
  .card.live{border-color:rgba(255,92,92,0.5);}
  .card.live::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:3px;
    background:#ff5c5c;
  }
  .avatar{
    width:44px; height:44px; border-radius:10px;
    background:linear-gradient(135deg,var(--pitch-line),#1c2822);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-size:15px; color:var(--turf-dim);
    overflow:hidden; flex-shrink:0;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .meta{min-width:0;}
  .name-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .name{font-weight:700; font-size:15px;}
  .live-badge{
    font-family:var(--font-mono); font-size:9px; letter-spacing:0.06em;
    background:#ff5c5c; color:#1a0a0a; padding:2px 6px; border-radius:5px;
    font-weight:700; flex-shrink:0;
  }
  .id-line{
    font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim);
    margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .tier-wrap{text-align:right; flex-shrink:0;}
  .tier-badge{
    font-family:var(--font-display); font-size:11px; letter-spacing:0.03em;
    padding:5px 10px; border-radius:8px;
    display:inline-block;
    white-space:nowrap;
  }
  /* divisionId가 낮을수록 상위 등급 (예: 800=슈퍼챔피언스, 3100=유망주3) */
  .tier-top{background:rgba(127,232,212,0.14); color:var(--plat); border:1px solid rgba(127,232,212,0.35);}     /* ~1300: 챌린저 이상 */
  .tier-high{background:rgba(140,170,255,0.14); color:#a9bcff; border:1px solid rgba(140,170,255,0.35);}        /* ~1900: 마스터 */
  .tier-mid{background:rgba(240,195,76,0.15); color:var(--gold); border:1px solid rgba(240,195,76,0.4);}        /* ~2200: 월드클래스 */
  .tier-low{background:rgba(199,208,205,0.12); color:var(--silver); border:1px solid rgba(199,208,205,0.3);}    /* ~2500: 프로 */
  .tier-basic{background:rgba(201,139,78,0.15); color:var(--bronze); border:1px solid rgba(201,139,78,0.4);}    /* 2600+: 세미프로/유망주 */
  .tier-unranked{background:rgba(92,107,100,0.15); color:var(--unranked); border:1px solid rgba(92,107,100,0.3);}
  .score{
    font-family:var(--font-mono); font-size:10px; color:var(--text-dim);
    margin-top:4px;
  }
  footer{
    max-width:760px; margin:28px auto 0; padding:0 16px;
    font-family:var(--font-mono); font-size:11px; color:var(--text-dim); line-height:1.6;
  }
  footer code{background:var(--bg-elev); padding:1px 5px; border-radius:4px;}
  .empty{
    text-align:center; padding:40px 20px; color:var(--text-dim); font-size:13px;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">SOOP · FC ONLINE</p>
  <h1>스트리머 티어보드</h1>
  <p class="sub">FC온라인 카테고리 스트리머 실력 랭킹 (수동 입력 데이터 · 프로토타입)</p>
  <div class="controls">
    <input type="text" id="search" placeholder="스트리머 이름 검색">
    <select id="sortSel">
      <option value="tier">티어순</option>
      <option value="name">이름순</option>
      <option value="live">방송중 우선</option>
    </select>
  </div>
</header>

<main>
  <div class="live-strip"><span class="dot"></span><span id="liveCount">0명 방송 중 (수동 갱신)</span></div>
  <div class="grid" id="grid"></div>
</main>

<footer>
데이터는 <code>data/streamers.json</code>에서 관리합니다.<br>
방송 상태는 60초마다 자동 확인하며, FC온라인 공식경기 1on1 티어는 5분마다 자동 조회합니다.
</footer>

<script>
/* ============================================================
   여기 배열만 수정하면 화면에 반영됩니다.
   id       : SOOP 채널 ID (URL의 마지막 부분, ch.sooplive.co.kr/아이디)
   name     : 표시할 스트리머 이름/닉네임
   tier     : "플래티넘" | "다이아" | "골드" | "실버" | "브론즈" | "미확인"
   score    : 참고용 텍스트 (승률, OVR 등 자유 기재)
   live     : true/false — 지금 방송 중인지 수동으로 체크
   note     : 카드에 작게 표시할 메모 (선택)
============================================================ */
// id         : SOOP 채널 ID
// name       : 표시할 이름
// fcNickname : FC온라인 게임 내 닉네임 (공식경기 1대1 티어 자동 조회에 사용)
// tier / divisionId 는 이제 넥슨 API에서 자동으로 채워지므로 직접 입력하지 않습니다.
let STREAMERS = [];
async function loadStreamers(){
  try{
    const res = await fetch('/data/streamers.json', { cache: 'no-store' });

    if(!res.ok){
      throw new Error('streamers.json fetch failed');
    }

    const data = await res.json();

    if(!Array.isArray(data)){
      throw new Error('streamers.json must be an array');
    }

    STREAMERS = data.map(s => ({
      ...s,
      live: false
    }));

    render();

  } catch(err){
    console.error('스트리머 데이터 불러오기 실패:', err);
    grid.innerHTML = '<div class="empty">스트리머 데이터를 불러오지 못했습니다.</div>';
  }
}
const LIVE_REFRESH_MS = 60000;   // SOOP 방송 여부: 60초마다
const TIER_REFRESH_MS = 300000;  // FC온라인 티어: 5분마다 (넥슨 데이터가 매시간 갱신되므로 자주 부를 필요 없음)

async function refreshLiveStatus(){
  const ids = STREAMERS.map(s => s.id).join(',');
  try{
    const res = await fetch(`/api/live-status?ids=${encodeURIComponent(ids)}`);
    if(!res.ok) throw new Error('status fetch failed');
    const data = await res.json();
    STREAMERS.forEach(s => {
      if(data[s.id]) s.live = !!data[s.id].live;
    });
  } catch(err){
    console.warn('실시간 상태 갱신 실패, 이전 상태 유지:', err);
  }
  render();
}

async function refreshTierStatus(){
  const nicknames = STREAMERS.map(s => s.fcNickname).join(',');
  try{
    const res = await fetch(`/api/tier?nicknames=${encodeURIComponent(nicknames)}`);
    if(!res.ok) throw new Error('tier fetch failed');
    const data = await res.json();
    STREAMERS.forEach(s => {
      const info = data[s.fcNickname];
      if(info && !info.error){
        s.tier = info.divisionName;
        s.divisionId = info.divisionId;
      } else if(info && info.error){
        s.tier = "조회 실패";
        s.divisionId = null;
        console.warn(`${s.name}(${s.fcNickname}) 티어 조회 실패:`, info.error);
      }
    });
  } catch(err){
    console.warn('티어 갱신 실패, 이전 상태 유지:', err);
  }
  render();
}

// divisionId가 낮을수록 상위 등급. 정렬/미확인 처리를 위해 없으면 맨 뒤로 보냄.
function divisionRank(s){
  return s.divisionId == null ? Infinity : s.divisionId;
}
function tierClass(divisionId){
  if(divisionId == null) return 'tier-unranked';
  if(divisionId <= 1300) return 'tier-top';
  if(divisionId <= 1900) return 'tier-high';
  if(divisionId <= 2200) return 'tier-mid';
  if(divisionId <= 2500) return 'tier-low';
  return 'tier-basic';
}

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const sortSel = document.getElementById('sortSel');
const liveCount = document.getElementById('liveCount');

function render(){
  const q = search.value.trim().toLowerCase();
  let list = STREAMERS.filter(s => s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q));

  const mode = sortSel.value;
  if(mode === "tier"){
    list.sort((a,b) => divisionRank(a) - divisionRank(b));
  } else if(mode === "name"){
    list.sort((a,b) => a.name.localeCompare(b.name, 'ko'));
  } else if(mode === "live"){
    list.sort((a,b) => (b.live - a.live) || (divisionRank(a) - divisionRank(b)));
  }

  liveCount.textContent = STREAMERS.filter(s=>s.live).length + "명 방송 중 (60초마다 자동 갱신)";

  if(list.length === 0){
    grid.innerHTML = '<div class="empty">검색 결과가 없습니다</div>';
    return;
  }

  grid.innerHTML = list.map(s => {
    const tierLabel = s.tier || "불러오는 중…";
    return `
    <a class="card ${s.live ? 'live' : ''}" href="https://ch.sooplive.co.kr/${s.id}" target="_blank" rel="noopener">
      <div class="avatar">${s.name.slice(0,1)}</div>
      <div class="meta">
        <div class="name-row">
          <span class="name">${s.name}</span>
          ${s.live ? '<span class="live-badge">LIVE</span>' : ''}
        </div>
        <div class="id-line">
  @${s.id}
  · FC ${s.fcNickname || '미등록'}
  ${s.soopTier ? ` · SOOP ${s.soopTier}` : ''}
  ${s.crew ? ` · ${s.crew}` : ''}
  ${s.note ? ` · ${s.note}` : ''}
</div>
      </div>
      <div class="tier-wrap">
        <span class="tier-badge ${tierClass(s.divisionId)}">${tierLabel}</span>
      </div>
    </a>
  `;}).join('');
}

search.addEventListener('input', render);
sortSel.addEventListener('change', render);
loadStreamers().then(() => {
  refreshLiveStatus();
  refreshTierStatus();

  setInterval(refreshLiveStatus, LIVE_REFRESH_MS);
  setInterval(refreshTierStatus, TIER_REFRESH_MS);
});
</script>

</body>
</html>
